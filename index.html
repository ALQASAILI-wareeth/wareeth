<style>
:root{
  --navy:#16213F; --bg:#F3EFE6; --bg2:#ECE6DA; --glow:rgba(176,138,68,.10); --card:#FFFCF6; --card2:#F7F2E8; --line:#D9CEB6;
  --ink:#1C1F2A; --muted:#55545E; --gold:#86641F; --gold-hi:#C9A253; --pos:#2F7A52; --neg:#A8473A; --btn:#FFFCF6; --btn-ink:#2A2D38;
  --font:"IBM Plex Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141B2D; --bg2:#10162A; --glow:rgba(120,145,195,.10); --card:#1B2338; --card2:#212A42; --line:#36426A;
    --ink:#F2F4F9; --muted:#B6BED3; --gold:#DDBB72; --gold-hi:#EBCF8F; --pos:#86D9AA; --neg:#F2A094; --btn:#1B2338; --btn-ink:#E3E6EE;
  }
}
:root[data-theme="dark"]{
  --bg:#141B2D; --bg2:#10162A; --glow:rgba(120,145,195,.10); --card:#1B2338; --card2:#212A42; --line:#36426A;
  --ink:#F2F4F9; --muted:#B6BED3; --gold:#DDBB72; --gold-hi:#EBCF8F; --pos:#86D9AA; --neg:#F2A094; --btn:#1B2338; --btn-ink:#E3E6EE;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;
  background:radial-gradient(ellipse 90% 55% at 50% 0%,var(--glow),transparent 70%) fixed,linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed,var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%}
.num{font-feature-settings:"tnum" 1,"lnum" 1;letter-spacing:.01em}
.row .m,.tile small,.sumrow span,.stat3 span,.rc .k,.field .k,label.k,.kv{font-weight:500}
.row .a,.kv b,.sumrow b{font-weight:700}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block;font-size:calc(1em * var(--ns,1))}

header.bar{position:fixed;top:0;left:0;right:0;z-index:20;color:#fff;display:grid;grid-template-columns:92px 1fr 92px;grid-template-rows:54px;align-items:center;padding:env(safe-area-inset-top,0px) 6px 0;overflow:hidden}
#hRight,#hLeft{display:flex;align-items:center}
#hLeft{justify-content:flex-end}
header.bar h1{margin:0;text-align:center;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;color:#fff;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;border-radius:10px}
.iconbtn svg{width:24px;height:24px}

main{max-width:640px;margin:0 auto;padding:16px 16px 14px}
html,body{height:100%;overflow:hidden}
#scroller{position:fixed;left:0;right:0;top:0;bottom:var(--navh,0px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
body.sub #scroller{top:var(--hdrh,54px)}
#scroller.lock{overflow:hidden}

/* banner */
.banner{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#0F1E4A 0%,#1A2F6E 55%,#0E1A40 100%);color:#fff;display:flex;align-items:center;gap:16px;padding:22px 18px;margin:4px 0 22px}
.banner{padding-left:50px!important}
.bgear{position:absolute;top:6px;left:6px;z-index:2;color:#E3C27A;width:40px;height:40px}
.bgear svg{width:22px;height:22px}
header.bar[hidden]{display:none}
.banner::after{content:"";position:absolute;inset:auto -10% -62% -10%;height:80%;border-top:1.5px solid rgba(214,178,102,.55);border-radius:50%;transform:rotate(-6deg)}
.mark{display:flex;flex-direction:column;align-items:center;gap:4px;padding-inline-end:16px;border-inline-end:1px solid rgba(214,178,102,.6)}
.mark svg{width:60px;height:55px}
.mark span{font-family:Georgia,"Times New Roman",serif;letter-spacing:.32em;font-size:10px;color:#E3C27A}
.banner h2{margin:0;font-size:20px;font-weight:700;line-height:1.35}
.banner p{margin:2px 0 0;font-size:14px;color:#C9D2EA}

.hero{margin:6px 2px 22px}
.hero .lbl{font-size:15px;color:var(--muted)}
.hero .big{font-size:36px;font-weight:700;line-height:1.15;margin:2px 0 6px}
.hero .big small{font-size:18px;font-weight:500;color:var(--muted)}
.hero .upd{font-size:13px;color:var(--muted)}

.menu{display:grid;gap:12px}
.mbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--btn);color:var(--btn-ink);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;text-align:start;font-size:17px;font-weight:600}
.mbtn .l{display:flex;align-items:center;gap:12px}

<script>
/* ===== بيانات ثابتة من المستندات ===== */
const HEIRS=[
  {id:'may',n:'مي',full:'مي راشد راشد المنصوري'},

  {id:'mohamed',n:'محمد',full:'محمد مبارك علي محمد المنصوري'},
  {id:'naser',n:'ناصر',full:'ناصر مبارك علي القصيلي المنصوري'},
  {id:'bakheeta',n:'بخيتة',full:'بخيتة مبارك علي المنصوري'},
  {id:'hamda',n:'حمدة',full:'حمدة مبارك علي القصيلي المنصوري'},
  {id:'shamma',n:'شمة',full:'شمة مبارك علي المنصوري'},
  {id:'madhheya',n:'مضحية',full:'مضحية مبارك علي المنصوري'},
  {id:'noura',n:'نورة',full:'نورة مبارك علي المنصوري'}
];
const H=Object.fromEntries(HEIRS.map(h=>[h.id,h]));
const SONS=['rashed','saeed','ali','eid','mohamed','naser'], DAUS=['bakheeta','hamda','shamma','madhheya','noura'];
function mk(may,son,dau){const o={may};SONS.forEach(s=>o[s]=son);DAUS.forEach(d=>o[d]=dau);return o;}
const ACCTS={
  bld:{name:'حساب البناية',short:'البناية',shares:Object.assign(mk(1.0416,9.1912,8.7622),{naser:9.1911,saeed:9.1911,eid:9.1911})},
  farm:{name:'حساب المزارع',short:'المزارع',shares:mk(12.5,10.2941,5.147)},

};
// الكسور الدقيقة اللي تطلع منها نسب السندات (النسب المكتوبة مقرّبة لأربع خانات)
// الإرث: الزوجة 1/8، كل ابن 7/68، كل بنت 7/136. البناية: منحة 1/12 لكل ابن وبنت + إرث الـ 1/12 الباقي بنفس الأنصبة.
function frac(may,son,dau){const o={may};SONS.forEach(s=>o[s]=son);DAUS.forEach(d=>o[d]=dau);return o;}
const W={bld:frac(1/96,1/12+7/816,1/12+7/1632),farm:frac(1/8,7/68,7/136)};W.old=W.farm;
const PROPS=[
  {id:'bld',acct:'bld',name:'البناية',plot:'C44',where:'مدينة محمد بن زايد (ME12)، أبوظبي',area:325.16,use:'تجاري – أبراج سكنية R35',addr:'6-283-000-C44',date:'1994/05/02',src:'مخطط أرض – مركز أبوظبي العقاري',shares:ACCTS.bld.shares},
  {id:'jrm',acct:'farm',name:'مزرعة جريمدة',plot:'FRM8',where:'ليوا، منطقة الظفرة',area:7228.42,use:'زراعي – أرض زراعية',addr:'25-5-000-FRM8',date:'2007/03/06',src:'مخطط أرض – دائرة البلديات والنقل',shares:Object.assign(mk(12.5,10.2941,5.147),{shamma:5.1469,noura:5.1469})},
  {id:'yaw',acct:'farm',name:'مزرعة يو النظرة',plot:'FRM41',where:'يو النظرة، منطقة الظفرة',area:40000,use:'زراعي – أرض زراعية · غير مرهون',addr:'0-3-000-FRM41',date:'2007/03/18',src:'سند ملكية – مركز أبوظبي العقاري',shares:mk(12.5,10.2941,5.147)},
  {id:'ghy',acct:'farm',name:'المسكن الشعبي – غياثي',plot:'300',where:'غياثي، منطقة الظفرة',area:5063,use:'سكني – بيت شعبي',addr:'27-9-000-300',date:'2007/03/25',src:'مخطط أرض – دائرة البلديات والنقل',shares:Object.assign(mk(12.5007,10.2941,5.1469))}
];
const P=Object.fromEntries(PROPS.map(p=>[p.id,p]));
const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون'];
const ord=i=>ORD[i]||('رقم '+(i+1));
const KIND={dep:'إيداع',exp:'مصروف',dist:'توزيع'};

/* ===== أدوات ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
// منسّقات جاهزة (إنشاؤها مرة وحدة أسرع بكثير من كل مرة)
const NF2=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=n=>NF2.format(r2(n));
const DFS={long:new Intl.DateTimeFormat('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
  short:new Intl.DateTimeFormat('ar-u-nu-latn',{day:'numeric',month:'long',year:'numeric'}),
  time:new Intl.DateTimeFormat('ar-u-nu-latn',{day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'})};
const DMEMO=new Map();
function dfmt(kind,s){const k=kind+s;let v=DMEMO.get(k);if(v!==undefined)return v;const d=parseD(s);v=d?DFS[kind].format(d):'';if(DMEMO.size>5000)DMEMO.clear();DMEMO.set(k,v);return v;}
const money=(n,cls='')=>`<span class="num ${cls}">${fmt(n)}</span> <span style="font-size:.8em">د.إ</span>`;
const pad=n=>String(n).padStart(2,'0');
const nowLocal=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;};
function parseD(s){if(!s)return null;const d=new Date(s.length<=10?s+'T00:00':s);return isNaN(d)?null:d;}
function dDate(s){return dfmt('long',String(s||''));}
function dShort(s){return dfmt('short',String(s||''));}
function dTime(s){return dfmt('time',String(s||''));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2000);}
const parseAmt=v=>parseFloat(String(v??'').replace(/٫/g,'.').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.\-]/g,''));
const byDate=(a,b)=>{const x=a.date||'',y=b.date||'';return x<y?-1:x>y?1:(a.createdAt||0)-(b.createdAt||0);};

/* ===== التخزين ===== */
const state={txs:[],stack:[{v:'home'}],form:null};
const LS='wareeth-v2';
let assetsApi=null,downloadsApi={save:async({filename,data})=>{const b=new Blob([data],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}};
const HAS_CLAUDE=false;
const APP_VER='5.1';
/* ===== الاتصال بالخادم (Google Apps Script) ===== */
const AUTH='wareeth-auth';
const auth=(()=>{try{return JSON.parse(localStorage.getItem(AUTH)||'{}')}catch(e){return {}}})();
const API_URLS=['https://script.google.com/macros/s/AKfycbwZj88mqWrVBcYs0l28oIm7GXR2e_xCKy24IJygvA2rhPRysQe5uQnozGGAv_uSU6Vv/exec','https://script.google.com/macros/s/AKfycbyJNSpaY-WW3puqcnd5vWDpgtjFiQkwXvOxV3m8_E9-VEmvxSFpLpGdYSz2_pRiy8EC/exec'];
const DEFAULT_API=API_URLS[0];
// الرابط الافتراضي يغلب دايماً، إلا إذا غيّره المستخدم بنفسه من شاشة الدخول
if(auth.def!==DEFAULT_API||(!auth.custom&&!API_URLS.includes(auth.url))){auth.url=DEFAULT_API;auth.custom=false;auth.def=DEFAULT_API;}
// أمان: ما نقبل رابط خادم من الرابط نفسه (#api=…) عشان ما أحد يرسل للورثة رابط يسرق أرقامهم السرية
(function(){if(/api=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);})();
const API_RE=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/;
if(auth.url&&!API_RE.test(auth.url)){auth.url=DEFAULT_API;auth.custom=false;}
function saveAuth(){try{localStorage.setItem(AUTH,JSON.stringify(auth))}catch(e){}}
let netN=0;
function net(d){netN=Math.max(0,netN+d);const e=document.getElementById('net');if(e)e.classList.toggle('on',netN>0);}
async function api(action,payload){net(1);try{
  try{return await api_(action,payload);}
  catch(e){
    // الرابط ما رد بشكل صحيح: جرّب روابط الخادم الثانية المعروفة (الطلب ما تنفّذ أصلاً)
    if(e&&e.error==='bad_response'&&!auth.custom){
      for(const u of API_URLS){if(u===auth.url)continue;const prev=auth.url;auth.url=u;
        try{const j=await api_(action,payload);saveAuth();return j;}
        catch(e2){if(e2&&e2.error!=='bad_response'&&e2.error!=='network'&&e2.error!=='timeout'){saveAuth();throw e2;}auth.url=prev;}}
    }
    throw e;}
}finally{net(-1);}}
let busyN=0,busyT=0;
/* نافذة صغيرة فيها علامة تدور، تطلع أثناء أي عملية يطلبها المستخدم */
function busy(text,sub){
  busyN++;const el=document.getElementById('busy');
  el.querySelector('.bx').innerHTML='<div class="ring"></div><span></span>'+(sub?'<small></small>':'');
  el.querySelector('span').textContent=text||'جاري…';if(sub)el.querySelector('small').textContent=sub;
  clearTimeout(busyT);busyT=setTimeout(()=>{if(busyN>0)el.classList.add('on');},120);
  let done=false;
  const fin=()=>{if(done)return;done=true;clearTimeout(guard);busyN=Math.max(0,busyN-1);if(!busyN){clearTimeout(busyT);el.classList.remove('on');}};
  const guard=setTimeout(fin,150000); // أمان: ما تعلق النافذة أبداً
  return fin;
}
// أي خطأ غير متوقع: نشيل نافذة الانتظار ونوضح للمستخدم بدل ما يعلق التطبيق
window.addEventListener('unhandledrejection',e=>{busyN=0;const b=document.getElementById('busy');if(b)b.classList.remove('on');console.error(e.reason);});
window.addEventListener('error',e=>{busyN=0;const b=document.getElementById('busy');if(b)b.classList.remove('on');});
// رقم مميز لهذا الجهاز: لو أحد خمّن الرقم السري غلط، ينقفل جهازه هو بس
const DEV=(()=>{try{let d=localStorage.getItem('wareeth-dev');if(!/^[A-Za-z0-9]{8,40}$/.test(d||'')){d=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>(b%36).toString(36)).join('')+Date.now().toString(36);localStorage.setItem('wareeth-dev',d);}return d;}catch(e){return 'nostore'+Math.random().toString(36).slice(2,10);}})();
async function api_(action,payload){
  if(!auth.url)throw {error:'no_url'};
  const q=JSON.stringify(Object.assign({action,pin:auth.pin,dev:DEV},payload||{}));
  const url=auth.url+'?action='+encodeURIComponent(action)+'&pin='+encodeURIComponent(auth.pin||'')+'&q='+encodeURIComponent(q);
  let res,text;
  try{
    const ac=typeof AbortController!=='undefined'?new AbortController():null;
    const tm=setTimeout(()=>ac&&ac.abort(),60000);
    try{
      res=url.length<7500?await fetch(url,{method:'GET',cache:'no-store',signal:ac&&ac.signal})
        :await fetch(auth.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:q,signal:ac&&ac.signal});
      text=await res.text();
    }finally{clearTimeout(tm);}
  }catch(e){throw {error:e&&e.name==='AbortError'?'timeout':'network'};}
  let j;
  try{j=JSON.parse(text);}catch(e){throw {error:'bad_response',status:res.status,kind:/already been declared|SyntaxError/.test(text)?'syntax':res.status===404?'notfound':/accounts\.google\.com|ServiceLogin/.test(text)?'access':'',detail:(res.status+' '+String(text||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()).slice(0,140)};}
  if(!j.ok)throw j;
  return j;
}
function apiErr(e){
  const c=e&&e.error;
  if(c==='pin')return 'الرقم السري غلط.';
  if(c==='locked')return 'هذا الجهاز انقفل مؤقتاً بسبب محاولات كثيرة غلط. انتظر نص ساعة، أو اطلب من المدير يفك القفل. باقي الأجهزة ما تتأثر.';
  if(c==='forbidden')return 'ما عندك صلاحية لهذي العملية.';
  if(c==='busy')return 'الخادم مشغول بطلب ثاني. حاول بعد ثواني.';
  if(c==='timeout')return 'الخادم تأخر في الرد. اضغط تحديث ↻ وتأكد قبل ما تعيد المحاولة.';
  if(c==='owned')return 'هذي الحركة باسم '+(store.agent||'الوكيل')+'، وأي تعديل عليها يحتاج موافقته.';
  if(c==='not_owned')return 'هذي الحركة باسمك وتقدر تعدّلها مباشرة.';
  if(c==='setup')return 'إعداد الخادم ناقص: الأرقام السرية الثلاثة لازم تكون مختلفة عن بعض و4 أرقام على الأقل (ملف "الأرقام" في Apps Script).';
  if(c==='bad_request')return 'البيانات المرسلة فيها خطأ'+(e.detail==='future'?': ما يصير تقفل تاريخ في المستقبل.':e.detail==='already_closed'?': هذي الفترة مقفولة من قبل.':e.detail?' ('+e.detail+').':'.');
  if(c==='closed')return 'هذي الفترة مقفولة (لين '+dShort(lockOf())+')، فما تنعدّل حركاتها إلا إذا المدير فتح السنة.';
  if(c==='not_found')return 'الطلب ما عاد موجود. حدّث البيانات.';
  if(c==='server')return 'صار خطأ في الخادم'+(e.detail?' ('+e.detail+')':'')+'.';
  if(c==='network')return 'ما فيه اتصال بالإنترنت، أو رابط الخادم غلط.';
  if(c==='no_url')return 'رابط الخادم ناقص.';

const HIST_IMPORT=Y25.concat(Y23);
async function importY25(){
  if(!store.canWrite||importY25.run)return;
  const have=new Set(state.txs.map(t=>t.id)),todo=HIST_IMPORT.filter(t=>!have.has(t.id));
  if(!todo.length)return;
  importY25.run=true;const p=document.getElementById('prog');let done=0,fail=0;
  for(const t of todo){
    p.hidden=false;p.textContent='جاري نقل الحركات القديمة من Glide: '+(done+fail+1)+' من '+todo.length;
    let ok=false;
    for(let k=0;k<3&&!ok;k++){try{await api('put',{tx:t});ok=true;}catch(e){await new Promise(r=>setTimeout(r,1500*(k+1)));}}
    if(ok){done++;state.txs.push(Object.assign({},t));}else fail++;
  }
  p.hidden=true;importY25.run=false;
  toast(fail?'انتقلت '+done+' حركة، و'+fail+' تعذّرت وبتنتقل المرة الجاية':'تم نقل '+done+' حركة قديمة من Glide');
  try{await store.refresh();}catch(e){}
}

function go(v,p={}){
  const nxt=Object.assign({v},p),same=s=>s.v===v&&(s.id||'')===(nxt.id||'')&&(s.k||'')===(nxt.k||'')&&(s.type||'')===(nxt.type||'');
  const idx=state.stack.findIndex(same);
  if(idx>=0){state.stack=state.stack.slice(0,idx+1);}          // الصفحة مفتوحة قبل: ارجع لها بدل ما تنفتح مرة ثانية
  else if(['tx','heir','month'].includes(v)&&cur().v===v){state.stack[state.stack.length-1]=nxt;} // نفس النوع: استبدال
  else{state.stack.push(nxt);if(state.stack.length>3)state.stack.splice(1,state.stack.length-3);} // أقصى عمق 3 صفحات
  render();scrollTop0();
}

const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function monthData(acct,year){
  const m=Array.from({length:12},()=>({dep:0,exp:0,dist:0,n:0}));
  const heirs=Object.fromEntries(HEIRS.map(h=>[h.id,0]));
  state.txs.forEach(t=>{
    if(t.from==='رصيد افتتاحي')return; // الرصيد الافتتاحي مو إيداع فعلي
    if(acct!=='all'&&t.acct!==acct)return;
    if(!(t.date||'').startsWith(year))return;
    const i=+(t.date.slice(5,7))-1;if(!(i>=0&&i<12))return;
    const a=+t.amount||0;m[i].n++;
    if(t.kind==='dep')m[i].dep+=a;else if(t.kind==='exp')m[i].exp+=a;else if(t.kind==='dist'){m[i].dist+=a;HEIRS.forEach(h=>heirs[h.id]+=+((t.alloc||{})[h.id])||0);}
  });
  return {m,heirs};
}
function barChart(m){
  const max=Math.max(1,...m.map(x=>Math.max(x.dep,x.exp+x.dist)));
  const W0=360,base=150,hMax=128,slot=(W0-16)/12;let g='';
  m.forEach((x,i)=>{
    const X=8+i*slot,hd=x.dep/max*hMax,hx=x.exp/max*hMax,hs=x.dist/max*hMax;
    g+=`<rect x="${(X+3).toFixed(1)}" y="${(base-hd).toFixed(1)}" width="11" height="${hd.toFixed(1)}" rx="2" style="fill:var(--pos)"><title>${MONTHS[i]}: إيداعات ${fmt(x.dep)}</title></rect>`;
    g+=`<rect x="${(X+15).toFixed(1)}" y="${(base-hs).toFixed(1)}" width="11" height="${hs.toFixed(1)}" rx="2" style="fill:var(--gold)"><title>${MONTHS[i]}: توزيعات ${fmt(x.dist)}</title></rect>`;
    g+=`<rect x="${(X+15).toFixed(1)}" y="${(base-hs-hx).toFixed(1)}" width="11" height="${hx.toFixed(1)}" rx="2" style="fill:var(--neg)"><title>${MONTHS[i]}: مصروفات ${fmt(x.exp)}</title></rect>`;
    g+=`<text x="${(X+slot/2).toFixed(1)}" y="166" text-anchor="middle" style="fill:var(--muted);font-size:10px">${i+1}</text>`;
  });
  return `<svg viewBox="0 0 ${W0} 172" role="img" aria-label="الإيداعات والمصروفات حسب الشهر" direction="ltr" style="width:100%;height:auto;display:block">
    <line x1="8" x2="352" y1="${base}" y2="${base}" style="stroke:var(--line)"/>
    <text x="352" y="12" text-anchor="end" style="fill:var(--muted);font-size:10px">أعلى شهر: ${fmt(max)}</text>${g}</svg>
    <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px">
      <span><i class="dot" style="display:inline-block;background:var(--pos);border-radius:2px"></i> إيداعات</span>
      <span><i class="dot" style="display:inline-block;background:var(--gold);border-radius:2px"></i> توزيعات</span>
      <span><i class="dot" style="display:inline-block;background:var(--neg);border-radius:2px"></i> مصروفات</span></div>`;
}

/* بنود المصروفات: الأساسية + اللي سبق استخدامها، مرتبة حسب الأكثر استخداماً */
const BASE_CATS=['رواتب عمال','فاتورة كهرباء','ماء','فاتورة مواد','صيانة','رسوم حكومية'];
const normCat=x=>String(x||'').trim().replace(/ه$/,'ة');
function expCats(){
  const cnt=new Map();
  state.txs.forEach(t=>{if(t.kind==='exp'&&t.from&&!t.hist){const k=normCat(t.from);if(!cnt.has(k))cnt.set(k,{label:t.from.trim(),n:0});cnt.get(k).n++;}});
  BASE_CATS.forEach(c=>{const k=normCat(c);if(!cnt.has(k))cnt.set(k,{label:c,n:0});});
  return [...cnt.values()].sort((a,b)=>b.n-a.n).map(x=>x.label);
}
const DEP_FROM={bld:['خاص','حكومي','شركة إيفرستون'],farm:['حكومي','خاص','الفوعة']};
function catSelect(f,cats,label,first,ph){
  cats=cats||expCats();label=label||'الجهة أو البند';first=first||'اختر البند';if(ph==null)ph='اكتب اسم البند';
  const inList=f.from&&cats.some(c=>normCat(c)===normCat(f.from));
  const other=f.other||(f.from&&!inList);
  return `<label class="k" for="fCat">${label}</label>
  <select id="fCat"><option value=""${!f.from&&!other?' selected':''}>${first}</option>
    ${cats.map(c=>`<option value="${esc(c)}"${!other&&inList&&normCat(c)===normCat(f.from)?' selected':''}>${esc(c)}</option>`).join('')}
    <option value="__other"${other?' selected':''}>أخرى…</option></select>
  ${other?`<input id="fFrom" style="margin-top:8px" placeholder="${ph}" value="${esc(f.from)}">`:''}`;
}

function readForm(){
  const f=state.form;if(!f)return;const q=id=>document.getElementById(id);
  if(q('fAmt'))f.amount=q('fAmt').value; if(q('fDate'))f.date=q('fDate').value; if(q('fNote'))f.note=q('fNote').value;
  if(q('fCat')){const v=q('fCat').value;f.other=v==='__other';f.from=f.other?(q('fFrom')?q('fFrom').value:f.from):v;}
  else if(q('fFrom'))f.from=q('fFrom').value;
  if(q('fProp'))f.prop=q('fProp').value;
  if(q('fTotal'))f.total=q('fTotal').value; if(q('fPer'))f.per=q('fPer').value;
  document.querySelectorAll('[data-inc]').forEach(c=>f.inc[c.dataset.inc]=c.checked);
  document.querySelectorAll('[data-al]').forEach(i=>f.alloc[i.dataset.al]=i.value);
}
function fillAlloc(){
  const f=state.form;if(!f)return;readForm();
  const ids=HEIRS.filter(h=>f.inc[h.id]).map(h=>h.id);
  if(f.mode==='share'){
    const tot=parseAmt(f.total);
    if(tot>0&&ids.length){const sw=ids.reduce((a,id)=>a+W[f.acct][id],0);let acc=0;
      ids.forEach((id,i)=>{let v=i===ids.length-1?r2(tot-acc):r2(tot*W[f.acct][id]/sw);acc=r2(acc+v);f.alloc[id]=String(v);});}
  } else if(f.mode==='fixed'){
    const per=parseAmt(f.per); if(per>0) ids.forEach(id=>f.alloc[id]=String(r2(per)));
  }
  HEIRS.forEach(h=>{if(!f.inc[h.id])f.alloc[h.id]='';});
  document.querySelectorAll('[data-al]').forEach(i=>{i.value=f.alloc[i.dataset.al];i.disabled=!f.inc[i.dataset.al];});
  updSum();
}
function allocSum(){const f=state.form;return HEIRS.reduce((a,h)=>a+(f.inc[h.id]&&parseAmt(f.alloc[h.id])>0?parseAmt(f.alloc[h.id]):0),0);}
function updSum(){
  const el=document.getElementById('allocSum');if(!el)return;readForm();
  const s=allocSum(),f=state.form,b=calc().bal[f.acct];
  let prev=0; if(f.edit){const t=state.txs.find(x=>x.id===f.edit); if(t&&t.acct===f.acct&&t.kind!=='dep') prev=+t.amount||0;}
  el.innerHTML=money(s); document.getElementById('overWarn').hidden=!(s>b+prev+0.005);
}

async function save(btn){
  readForm();const f=state.form,err=document.getElementById('fErr');err.textContent='';
  const old=f.edit?state.txs.find(x=>x.id===f.edit):null;
  const t={id:old?old.id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),acct:f.acct,
    kind:f.kind==='dep'?'dep':f.out,date:f.date,note:(f.note||'').trim().slice(0,500),
    createdAt:old?(old.createdAt||Date.now()):Date.now(),updatedAt:Date.now()};
  if(!f.date){err.textContent='اختر التاريخ.';return;}
  if(isLocked(f.date)||(old&&txLocked(old))){err.textContent='هذا التاريخ داخل فترة مقفولة (لين '+dShort(lockOf())+'). اختر تاريخ بعده.';return;}
  if(t.kind==='dist'){
    const alloc={};HEIRS.forEach(h=>{const v=parseAmt(f.alloc[h.id]);if(f.inc[h.id]&&v>0)alloc[h.id]=r2(v);});
    if(!Object.keys(alloc).length){err.textContent='حدد وريثاً واحداً على الأقل واكتب مبلغه.';return;}
    t.alloc=alloc;t.amount=r2(Object.values(alloc).reduce((a,b)=>a+b,0));
  } else {
    const a=parseAmt(f.amount);if(!(a>0)){err.textContent='اكتب مبلغاً أكبر من صفر.';return;}
    if(t.kind==='exp'&&!(f.from||'').trim()){err.textContent=f.other?'اكتب اسم البند.':'اختر البند من القائمة.';return;}
    t.amount=r2(a);t.from=(f.from||'').trim().slice(0,120);
    if(t.kind==='dep'&&f.acct==='farm'&&f.prop)t.prop=f.prop;
  }
  if(f.receipt&&f.receipt.id)t.receipt={id:f.receipt.id,type:f.receipt.type||''};
  if(old&&old.hist)t.hist=true;
  if(old&&old.src)t.src=old.src;
  btn.disabled=true;
  try{const res=await store.put(t);
    if(res==='req'||res==='req2'){toast(res==='req'?'انرسل الطلب لاعتماد المدير':'انرسل الطلب لموافقة '+(store.agent||'الوكيل'));state.form=null;state.stack.pop();go('reqs');return;}
    toast(old?'تم حفظ التعديل':'تم الحفظ');state.form=null;state.stack.pop();
    if(!old){state.stack.push({v:'tx',id:t.id});} render();scrollTop0();
    const list=state.txs.filter(x=>x.id!==t.id).concat([t]);
    (res&&res.bg?res.bg:Promise.resolve()).then(()=>afterChange(old?'edit':'new',t,list)).catch(()=>{});}
  catch(x){console.error(x);err.textContent='ما انحفظت: '+(x&&x.error?apiErr(x):(x&&x.message)||'خطأ غير معروف');btn.disabled=false;}
}

const lockOf=()=>store.lock||'';
const isLocked=d=>!!lockOf()&&String(d||'').slice(0,10)<=lockOf();
const txLocked=t=>!!(t&&isLocked(t.date));
const todayStr=()=>nowLocal().slice(0,10);
const dayDiff=(a,b)=>Math.round((new Date(String(a).slice(0,10)+'T00:00')-new Date(String(b).slice(0,10)+'T00:00'))/864e5);
/* رصيد حساب لين تاريخ (شامل) أو قبله (strict) — الحركات السابقة ما تنحسب لأنها داخلة في الرصيد الافتتاحي */
function balAt(acct,d,strict){let b=0;state.txs.forEach(t=>{if(t.hist||t.acct!==acct)return;const x=(t.date||'').slice(0,10);if(strict?x>=d:x>d)return;const a=+t.amount||0;b+=t.kind==='dep'?a:-a;});return r2(b);}
function periodSums(acct,from,to){const s={dep:0,exp:0,dist:0,open:0,n:0};state.txs.forEach(t=>{if(t.hist||t.acct!==acct)return;const x=(t.date||'').slice(0,10);if(x<from||x>to)return;const a=+t.amount||0;s.n++;
  if(t.kind==='dep'){if(t.from==='رصيد افتتاحي')s.open+=a;else s.dep+=a;}else if(t.kind==='exp')s.exp+=a;else if(t.kind==='dist')s.dist+=a;});return s;}
function yearSummary(acct,year,to){
  const from=year+'-01-01';to=to||year+'-12-31';const s=periodSums(acct,from,to);const open=r2(balAt(acct,from,true)+s.open);
  return {open,dep:r2(s.dep),exp:r2(s.exp),dist:r2(s.dist),close:r2(open+s.dep-s.exp-s.dist),n:s.n};
}
/* المعدّل الشهري (بدون الرصيد الافتتاحي والحركات السابقة) */
function monthlyAvg(list){
  const xs=list.filter(t=>!t.hist&&t.from!=='رصيد افتتاحي');if(!xs.length)return null;
  const ds=xs.map(t=>(t.date||'').slice(0,7)).filter(Boolean).sort();const a=ds[0],b=ds[ds.length-1];
  const n=Math.max(1,(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7))+1);
  let tin=0,tout=0;xs.forEach(t=>{if(t.kind==='dep')tin+=+t.amount||0;else tout+=+t.amount||0;});
  return {n,tin:r2(tin/n),tout:r2(tout/n)};
}

let ocrProg=()=>{};

async function pdfLines(file,prog){
  await loadScript(PDFJS);const L=window.pdfjsLib;L.GlobalWorkerOptions.workerSrc=PDFJS_W;
  const doc=await L.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  let lines=[],chars=0;
  for(let p=1;p<=doc.numPages;p++){
    prog('قراءة الصفحة '+p+' من '+doc.numPages);
    const pg=await doc.getPage(p),tc=await pg.getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5]}));
    chars+=items.reduce((a,i)=>a+i.s.length,0);
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    const rows=[];let cur=null;items.forEach(i=>{if(cur&&Math.abs(cur.y-i.y)<=3)cur.items.push(i);else{cur={y:i.y,items:[i]};rows.push(cur);}});
    rows.forEach(r=>lines.push(r.items.sort((a,b)=>a.x-b.x).map(i=>i.s.trim()).join('   ')));
  }
  if(chars<40){ // ملف ممسوح ضوئياً: نقرأ الصفحات كصور
    lines=[];
    for(let p=1;p<=doc.numPages;p++){
      const pg=await doc.getPage(p),vp=pg.getViewport({scale:2.2}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
      await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      lines=lines.concat(await ocrLines(cv,m=>prog('صفحة '+p+' من '+doc.numPages+': '+m)));
    }
  }
  return lines;
}
const MONTH_KEY={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,'يناير':1,'فبراير':2,'مارس':3,'أبريل':4,'ابريل':4,'مايو':5,'يونيو':6,'يوليو':7,'أغسطس':8,'اغسطس':8,'سبتمبر':9,'أكتوبر':10,'اكتوبر':10,'نوفمبر':11,'ديسمبر':12};
const normDig=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,',');
function findDates(s){
  const out=[];const add=(y,m,d,raw)=>{y=+y;m=+m;d=+d;if(y<100)y+=2000;if(y>=2000&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=31)out.push({d:`${y}-${pad(m)}-${pad(d)}`,raw});};
  let m;const re1=/(^|[^\d])(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?!\d)/g;while((m=re1.exec(s)))add(m[2],m[3],m[4],m[0].slice(m[1].length));
  const re2=/(^|[^\d.,])(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})(?!\d)/g;while((m=re2.exec(s)))add(m[4],m[3],m[2],m[0].slice(m[1].length));
  const re3=/(^|[^\d])(\d{1,2})[\s\-]*([A-Za-z]{3,9}|[ء-ي]{3,7})[\s\-,]*(\d{4}|\d{2})(?!\d)/g;
  while((m=re3.exec(s))){const k=m[3].toLowerCase();const mo=MONTH_KEY[k.slice(0,3)]||MONTH_KEY[m[3]];if(mo)add(m[4],mo,m[2],m[0].slice(m[1].length));}
  return out;
}
const RE_OPEN=/opening\s*balance|balance\s*(brought|b\/f)|previous\s*balance|beginning\s*balance|الرصيد\s*الافتتاحي|الرصيد\s*السابق|رصيد\s*سابق|رصيد\s*أول\s*المدة|الرصيد\s*المنقول/i;
const RE_CLOSE=/closing\s*balance|ending\s*balance|balance\s*(carried|c\/f)|available\s*balance|current\s*balance|ledger\s*balance|الرصيد\s*الختامي|الرصيد\s*الحالي|الرصيد\s*المتاح|رصيد\s*آخر\s*المدة|الرصيد\s*النهائي|رصيد\s*الإقفال/i;
const RE_CR=/\b(cr|credit|deposit|salary|inward|refund|received|transfer\s*from)\b|إيداع|ايداع|وارد|دائن|راتب|تحويل\s*من|استرداد|دعم/i;
const RE_DR=/\b(dr|debit|withdrawal|withdraw|purchase|payment|charges?|fee|fees|transfer\s*to|outward|pos|atm)\b|سحب|خصم|مدين|رسوم|دفع|شراء|تحويل\s*إلى|تحويل\s*الى|صادر/i;
function amountsIn(s){const out=[];const re=/(-?)(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+\.\d{2})(?!\d)\s*(CR|DR|Cr|Dr|cr|dr)?/g;let m;
  while((m=re.exec(s))){let v=parseFloat(m[2].replace(/,/g,''));if(!isFinite(v))continue;out.push({v:r2(v),neg:!!m[1],suf:(m[3]||'').toUpperCase()});}return out;}
function parseStatement(lines){
  let open=null,close=null;const rows=[];
  lines.forEach(L0=>{
    const L=normDig(L0);
    if(RE_OPEN.test(L)||RE_CLOSE.test(L)){
      let s=L;findDates(L).forEach(d=>s=s.replace(d.raw,' '));const a=amountsIn(s);
      if(a.length){const v=a[a.length-1];const val=v.neg||v.suf==='DR'?-v.v:v.v;if(RE_OPEN.test(L)&&open==null)open=val;if(RE_CLOSE.test(L))close=val;}
      return;
    }
    const ds=findDates(L);if(!ds.length)return;
    let s=L;ds.forEach(d=>s=s.replace(d.raw,' '));
    const a=amountsIn(s);if(!a.length)return;
    const desc=s.replace(/(-?)(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+\.\d{2})(\s*(CR|DR|Cr|Dr))?/g,' ').replace(/\s{2,}/g,' ').trim().slice(0,120);
    rows.push({d:ds[0].d,desc,a,line:L0});
  });
  if(rows.length>1&&rows[0].d>rows[rows.length-1].d)rows.reverse(); // الأحدث أولاً → نرتبها من الأقدم
  let prev=open;
  rows.forEach(r=>{
    const a=r.a;let bal=null,cands=a;
    if(a.length>=2){const b=a[a.length-1];bal=b.neg||b.suf==='DR'?-b.v:b.v;cands=a.slice(0,-1);}
    r.bal=bal;r.amount=cands[0].v;r.sign=0;
    if(bal!=null&&prev!=null){const delta=r2(bal-prev);const c=cands.find(x=>Math.abs(x.v-Math.abs(delta))<0.011);if(c&&delta!==0){r.amount=c.v;r.sign=delta>0?1:-1;}}
    if(!r.sign){const c=cands[0];if(c.suf==='CR')r.sign=1;else if(c.suf==='DR'||c.neg)r.sign=-1;else if(RE_CR.test(r.line)&&!RE_DR.test(r.line))r.sign=1;else if(RE_DR.test(r.line)&&!RE_CR.test(r.line))r.sign=-1;}
    if(bal!=null){if(prev==null&&r.sign)open=r2(bal-r.sign*r.amount);prev=bal;}
    delete r.a;

  const ds=rows.map(r=>r.d).sort();
  return {rows,open,close,from:ds[0]||'',to:ds[ds.length-1]||'',lines:lines.length};
}
function reconcile(k,P){
  const from=P.from,to=P.to;
  const app=state.txs.filter(t=>!t.hist&&t.acct===k&&t.from!=='رصيد افتتاحي');
  const used=new Set(),usedRow=new Set(),matched=[];
  P.rows.forEach((r,i)=>{
    if(!r.sign)return;const kinds=r.sign>0?['dep']:['exp','dist'];let best=null,bd=1e9;
    app.forEach(t=>{if(used.has(t.id)||!kinds.includes(t.kind)||Math.abs((+t.amount||0)-r.amount)>0.011)return;const dd=Math.abs(dayDiff(t.date,r.d));if(dd<=7&&dd<bd){bd=dd;best=t;}});
    if(best){used.add(best.id);usedRow.add(i);matched.push({r,t:best});}
  });
  // التوزيع ينزل في البنك تحويلات منفصلة لكل وريث
  app.filter(t=>t.kind==='dist'&&!used.has(t.id)).forEach(t=>{
    const parts=Object.values(t.alloc||{}).map(Number).filter(v=>v>0);const take=[];
    for(const v of parts){const i=P.rows.findIndex((r,j)=>!usedRow.has(j)&&!take.includes(j)&&r.sign<0&&Math.abs(r.amount-v)<0.011&&Math.abs(dayDiff(t.date,r.d))<=7);if(i<0)return;take.push(i);}
    if(take.length){take.forEach(i=>usedRow.add(i));used.add(t.id);matched.push({r:P.rows[take[0]],t,group:take.length});}
  });
  const ubank=P.rows.map((r,i)=>Object.assign({i},r)).filter(r=>!usedRow.has(r.i));
  const uapp=app.filter(t=>!used.has(t.id)&&(t.date||'').slice(0,10)>=from&&(t.date||'').slice(0,10)<=to);
  const credits=r2(P.rows.filter(r=>r.sign>0).reduce((a,r)=>a+r.amount,0)),debits=r2(P.rows.filter(r=>r.sign<0).reduce((a,r)=>a+r.amount,0));
  return {matched,mrows:usedRow.size,ubank,uapp,appBal:to?balAt(k,to):null,credits,debits,unknown:P.rows.filter(r=>!r.sign).length};
}
async function readStatement(files,k){

  try{
    let lines=[];
    for(const f of files){
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))lines=lines.concat(await pdfLines(f,prog));
      else if((f.type||'').startsWith('image/'))lines=lines.concat(await ocrLines(f,prog));

    state.bank={acct:k,files:files.map(f=>f.name),P,err:P.rows.length?'':'ما لقيت عمليات واضحة في الملف. تقدر تكتب رصيد البنك يدوياً تحت، أو ترسل الكشف لمدير التطبيق عشان نضبط القراءة على شكل كشف بنككم.'};

  finally{done();}
  render();
}

/* ===== تصدير PDF: يرسم الصفحات على canvas (الخط العربي يطلع سليم) ويجمعها في ملف PDF بدون أي مكتبة ===== */
const PG={w:1190,h:1684,m:64}; // A4 بدقة مضاعفة
const PDF_FONT='"IBM Plex Sans Arabic", Tahoma, Arial, sans-serif';
let pdfLogo=null;
async function pdfPrep(){
  try{await Promise.all(['400','600','700'].map(w=>document.fonts.load(w+' 22px "IBM Plex Sans Arabic"','وريث 123')).concat([document.fonts.load('700 34px Amiri','وريث')]));}catch(e){}
  if(!pdfLogo){
    const svg=markSvg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="414" height="380" ');
    pdfLogo=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});
  }
}
function pdfFit(c,s,w){s=String(s??'');if(c.measureText(s).width<=w)return s;while(s.length>1&&c.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…';}
function pdfWrap(c,s,w){const out=[];String(s||'').split('\n').forEach(par=>{let line='';par.split(/\s+/).forEach(word=>{const t=line?line+' '+word:word;if(c.measureText(t).width>w&&line){out.push(line);line=word;}else line=t;});out.push(line);});return out;}
const pdfIsNum=s=>/^[\d,.\-+ %]+$/.test(String(s).trim())&&/\d/.test(String(s));
function pdfRR(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
/* doc = {title, sub, cards:[[label,value,color]], sections:[{title, cols:[{h,w,al}], rows:[[cell..]], foot:[..]}], note} */
/* دقة الطباعة: الصفحة ترسم بمقاس 1190×1684 وتتكبّر 2.1 مرة ≈ 300 نقطة في البوصة */
const PDF_RS=2.1,PDF_Q=0.94;
function pdfPages(doc,total){
  const dry=total==null; // أول مرة نحسب عدد الصفحات بس، والمرة الثانية نرسم بالدقة العالية
  const W=PG.w,H=PG.h,M=PG.m,CW=W-2*M,out=[];let c,y,cv=null,count=0;
  const NAVY='#16244F',GOLD='#B08A44',INK='#22263A',MUTED='#6B7286',LINE='#E4E1D8',ZEBRA='#FAF7F0';
  const font=(sz,wt)=>`${wt||400} ${sz}px ${PDF_FONT}`;
  const text=(s,x,yy,o={})=>{c.font=o.font||font(o.size||21,o.w);c.fillStyle=o.color||INK;c.textBaseline='middle';
    s=String(s??'');c.direction=(o.num??pdfIsNum(s))?'ltr':'rtl';c.textAlign=o.align||'right';c.fillText(o.max?pdfFit(c,s,o.max):s,x,yy);};
  const bottom=()=>H-M-40;
  function footer(){
    c.fillStyle=LINE;c.fillRect(M,H-M-14,CW,1);
    text('صفحة '+count+' من '+(total||count),M,H-M+12,{size:16,color:MUTED,align:'left',num:false});
    text('تطبيق وريث · '+APP_URL.replace(/^https?:\/\//,'').replace(/\/$/,''),W-M,H-M+12,{size:16,color:MUTED,num:false});
  }
  // نحوّل كل صفحة لصورة أول ما تخلص ونفضي الذاكرة (مهم للآيفون)
  function finish(){
    if(!cv)return;footer();
    if(!dry){out.push(cv.toDataURL('image/jpeg',PDF_Q));cv.width=1;cv.height=1;cv=null;}
  }
  function page(){
    finish();count++;
    if(dry){if(!cv){cv=document.createElement('canvas');cv.width=1;cv.height=1;c=cv.getContext('2d');}}
    else{cv=document.createElement('canvas');cv.width=Math.round(W*PDF_RS);cv.height=Math.round(H*PDF_RS);c=cv.getContext('2d');
      c.setTransform(PDF_RS,0,0,PDF_RS,0,0);c.imageSmoothingQuality='high';c.fillStyle='#FFFFFF';c.fillRect(0,0,W,H);}
    if(count===1){
      const g=c.createLinearGradient(0,0,W,220);g.addColorStop(0,'#1F3670');g.addColorStop(1,'#0E1A3E');c.fillStyle=g;c.fillRect(0,0,W,220);
      c.fillStyle=GOLD;c.fillRect(0,220,W,4);
      if(pdfLogo)c.drawImage(pdfLogo,W-M-104,38,104,96);
      text('WAREETH',W-M-52,158,{font:'600 15px Georgia, serif',color:'#E3C27A',align:'center',num:true});
      text(doc.title,W-M-140,88,{font:`700 40px Amiri, ${PDF_FONT}`,color:'#FFFFFF',max:CW-470});
      if(doc.sub)text(doc.sub,W-M-140,146,{size:22,color:'#E3C27A',max:CW-470});
      text('ورثة مبارك علي القصيلي',M,88,{font:`700 26px Amiri, ${PDF_FONT}`,color:'#DCE3F5',align:'left'});
      text('تاريخ الإصدار: '+dShort(nowLocal()),M,146,{size:19,color:'#B9C4E2',align:'left'});
      y=264;
    } else {
      text(doc.title,W-M,62,{size:22,w:700,color:NAVY,max:CW*0.65});
      if(doc.sub)text(doc.sub,M,62,{size:18,color:MUTED,align:'left',max:CW*0.33});
      c.fillStyle=GOLD;c.fillRect(M,90,CW,2);y=124;
    }
  }
  page();
  // البطاقات (الملخص)
  if(doc.cards&&doc.cards.length){
    const n=doc.cards.length,gap=16,cw=(CW-gap*(n-1))/n,ch=104;
    doc.cards.forEach(([k,v,col],i)=>{const x=W-M-(i+1)*cw-i*gap;
      pdfRR(c,x,y,cw,ch,14);c.fillStyle=ZEBRA;c.fill();c.strokeStyle=LINE;c.lineWidth=2;c.stroke();
      c.fillStyle=col||GOLD;c.fillRect(x+cw-6,y+18,4,ch-36);
      text(k,x+cw-22,y+32,{size:18,color:MUTED,max:cw-36});
      text(v,x+cw-22,y+72,{size:n>3?27:30,w:700,color:col||INK,max:cw-36,align:'right'});});
    y+=ch+30;
  }
  (doc.sections||[]).forEach(sec=>{
    const cols=sec.cols,tw=cols.reduce((a,k)=>a+k.w,0),rh=46,hh=50;
    const xs=[];let xr=W-M;cols.forEach(k=>{const w=k.w/tw*CW;xs.push([xr-w,xr]);xr-=w;});
    const head=()=>{pdfRR(c,M,y,CW,hh,10);c.fillStyle=NAVY;c.fill();
      cols.forEach((k,i)=>{const [l,r]=xs[i];text(k.h,k.al==='l'?l+14:k.al==='c'?(l+r)/2:r-14,y+hh/2,{size:18,w:600,color:'#FFFFFF',align:k.al==='l'?'left':k.al==='c'?'center':'right',max:r-l-24,num:false});});
      y+=hh;};
    if(sec.title){if(y+60+hh+rh>bottom())page();text(sec.title,W-M,y+18,{size:25,w:700,color:NAVY});c.fillStyle=GOLD;c.fillRect(W-M-60,y+40,60,3);y+=60;}
    head();
    const row=(cells,i,isFoot)=>{
      if(y+rh>bottom()){page();head();}
      if(isFoot){c.fillStyle='#EFE8D8';c.fillRect(M,y,CW,rh+4);}else if(i%2){c.fillStyle=ZEBRA;c.fillRect(M,y,CW,rh);}
      c.fillStyle=LINE;c.fillRect(M,y+(isFoot?rh+4:rh)-1,CW,1);
      cells.forEach((cell,j)=>{if(cell==null||j>=cols.length)return;const k=cols[j],[l,r]=xs[j],o=typeof cell==='object'?cell:{t:cell};
        text(o.t,k.al==='l'?l+14:k.al==='c'?(l+r)/2:r-14,y+(isFoot?rh+4:rh)/2,{size:19,w:isFoot||o.b?700:400,color:o.c||INK,align:k.al==='l'?'left':k.al==='c'?'center':'right',max:r-l-24});});
      y+=isFoot?rh+4:rh;};
    if(!sec.rows.length){text('ما فيه بيانات.',W/2,y+30,{size:19,color:MUTED,align:'center'});y+=60;}
    sec.rows.forEach((r,i)=>row(r,i,false));
    if(sec.foot)row(sec.foot,0,true);
    y+=34;
  });
  if(doc.note){c.font=font(17);const lines=pdfWrap(c,doc.note,CW);lines.forEach(l=>{if(y+30>bottom())page();text(l,W-M,y+12,{size:17,color:MUTED,num:false});y+=30;});}
  finish();
  return dry?count:out;
}
async function pdfBlob(pages){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const put=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};
  const obj=(n,body)=>{offs[n]=len;put(n+' 0 obj\n');if(Array.isArray(body))body.forEach(put);else put(body);put('\nendobj\n');};
  put('%PDF-1.4\n%âãÏÓ\n');
  const n=pages.length,kids=[];for(let i=0;i<n;i++)kids.push((3+i*3)+' 0 R');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`);
  const IW=Math.round(PG.w*PDF_RS),IH=Math.round(PG.h*PDF_RS);
  for(let i=0;i<n;i++){
    const b64=atob(pages[i].slice(pages[i].indexOf(',')+1)),img=new Uint8Array(b64.length);for(let j=0;j<b64.length;j++)img[j]=b64.charCodeAt(j);
    pages[i]=null;const pg=3+i*3;
    if(i%2)await new Promise(r=>setTimeout(r,0));
    const content='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(pg,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${pg+2} 0 R >> >> /Contents ${pg+1} 0 R >>`);
    obj(pg+1,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    obj(pg+2,[`<< /Type /XObject /Subtype /Image /Width ${IW} /Height ${IH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`,img,'\nendstream']);
  }
  const xref=len,size=3+n*3;
  let x=`xref\n0 ${size}\n0000000000 65535 f \n`;for(let i=1;i<size;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  put(x+`trailer\n<< /Size ${size} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function exportPdf(doc,name){
  const done=busy('جاري تجهيز ملف PDF…','لحظات بس');
  try{await pdfPrep();await new Promise(r=>setTimeout(r,30));const total=pdfPages(doc,null);const pages=pdfPages(doc,total);const blob=await pdfBlob(pages);done();offerFile(blob,name);}
  catch(e){done();toast('ما قدرت أجهز الملف. حاول مرة ثانية.');console.error(e);}
}
function offerFile(blob,name){
  let file=null;try{file=new File([blob],name,{type:'application/pdf'});}catch(e){}
  const url=URL.createObjectURL(blob);

      (res&&res.bg?res.bg:Promise.resolve()).then(()=>afterChange('del',t,state.txs.filter(x=>x.id!==t.id))).catch(()=>{});}
    catch(x){done();toast(x&&x.error?apiErr(x):'تعذّر الحذف');}
    return;
  }
  if(d.act==='export'){
    const list=moveList(d.k,d.type==='dep'?'dep':'out').sort((a,b)=>byDate(b,a)),sm=moveSums(list);
    const ttl=(d.type==='dep'?'تقرير الإيداعات':'تقرير المصروفات')+' – '+ACCTS[d.k].short;
    exportPdf({title:ttl,sub:ACCTS[d.k].name,cards:[['عدد الحركات',String(list.length)],['المجموع',fmt(d.type==='dep'?sm.tin:sm.tout),d.type==='dep'?'#2F7A52':'#A8473A']],
      sections:[{cols:TX_COLS,rows:list.map(txCells),foot:['المجموع','','','','',{t:fmt(d.type==='dep'?sm.tin:sm.tout)}]}]},pdfName(ttl));
    return;
  }
  if(d.act==='rep-export'){
    const {m,heirs}=monthData(d.k,d.id),an=d.k==='all'?'الحسابين':ACCTS[d.k].short;
    const tot=m.reduce((a,x)=>({dep:a.dep+x.dep,exp:a.exp+x.exp,dist:a.dist+x.dist}),{dep:0,exp:0,dist:0});
    const G='#2F7A52',R='#A8473A',net=x=>({t:fmt(x),c:x>=0?G:R});
    const mrows=m.map((x,i)=>x.n?[MONTHS[i],{t:fmt(x.dep),c:G},{t:fmt(x.exp),c:R},fmt(x.dist),net(x.dep-x.exp-x.dist)]:null).filter(Boolean);
    const secs=[{title:'حسب الشهر',cols:[{h:'الشهر',w:20},{h:'الإيداعات',w:20,al:'l'},{h:'المصروفات',w:20,al:'l'},{h:'التوزيعات',w:20,al:'l'},{h:'الصافي',w:20,al:'l'}],
      rows:mrows,foot:['المجموع',fmt(tot.dep),fmt(tot.exp),fmt(tot.dist),fmt(tot.dep-tot.exp-tot.dist)]}];
    if(tot.dist>0)secs.push({title:'المستلم لكل وريث في '+d.id,cols:[{h:'الوريث',w:50},{h:'المبلغ المستلم',w:50,al:'l'}],
      rows:HEIRS.filter(h=>heirs[h.id]>0).map(h=>[h.full||h.n,fmt(heirs[h.id])]),foot:['المجموع',fmt(Object.values(heirs).reduce((a,b)=>a+b,0))]});
    const list=state.txs.filter(t=>t.from!=='رصيد افتتاحي'&&(d.k==='all'||t.acct===d.k)&&(t.date||'').startsWith(d.id)).sort(byDate);
    secs.push({title:'تفاصيل الحركات ('+list.length+')',cols:TX_COLS,rows:list.map(txCells)});
    exportPdf({title:'التقرير السنوي '+d.id,sub:an,cards:[['الإيداعات',fmt(tot.dep),G],['المصروفات',fmt(tot.exp),R],['التوزيعات',fmt(tot.dist),'#B08A44'],['الصافي',fmt(tot.dep-tot.exp-tot.dist),'#16244F']],
      sections:secs,note:'التقرير يشمل كل حركات السنة، ومنها الحركات السابقة المنقولة من Glide، وما يشمل الرصيد الافتتاحي لأنه مو إيداع فعلي.'},
      pdfName('تقرير '+d.id+' - '+an));
    return;
  }
  if(d.act==='heir-export'){
    const h=H[d.id],r=calc(),rc=receipts(d.id),nb=r.bal.bld*W.bld[d.id],nf=r.bal.farm*W.farm[d.id];
    exportPdf({title:'كشف '+h.n,sub:h.full||h.n,cards:[['عدد الاستلامات',String(rc.length)],['مجموع المستلم',fmt(r.received[d.id]),'#B08A44'],['نصيبه من الرصيد الحالي',fmt(nb+nf),'#16244F']],
      sections:[{title:'الاستلامات',cols:[{h:'#',w:22},{h:'التاريخ',w:30},{h:'الحساب',w:22},{h:'المبلغ',w:26,al:'l'}],
        rows:rc.map((x,i)=>['الاستلام '+ord(i),dShort(x.t.date),ACCTS[x.t.acct].short,fmt(x.amt)]),foot:['المجموع','','',fmt(r.received[d.id])]},
       {title:'نصيبه من الرصيد الحالي',cols:[{h:'الحساب',w:40},{h:'الحصة',w:25,al:'c'},{h:'المبلغ',w:35,al:'l'}],
        rows:[['البناية',ACCTS.bld.shares[d.id]+'%',fmt(nb)],['المزارع',ACCTS.farm.shares[d.id]+'%',fmt(nf)]],foot:['المجموع','',fmt(nb+nf)]}],
      note:'حصته من التوزيعات المسجلة في الحسابين حسب السند: '+fmt(r.entitled[d.id])+' د.إ، واستلم منها '+fmt(r.recvLedger[d.id])+' د.إ.'},pdfName('كشف '+h.n));
    return;
  }
});

/* نافذة تأكيد داخل الصفحة (نوافذ المتصفح confirm محجوبة داخل التطبيق) */
function ask(title,msg,okLabel){
  return new Promise(res=>{
    const bg=document.createElement('div');bg.className='modal-bg';
    bg.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mT"><h4 id="mT"></h4><p></p>
      <div class="actions"><button class="ghost" data-m="0">إلغاء</button><button class="btn-danger" data-m="1"></button></div></div>`;
    bg.querySelector('h4').textContent=title;bg.querySelector('p').textContent=msg||'';bg.querySelector('.btn-danger').textContent=okLabel||'تأكيد';
    const done=v=>{bg.remove();document.removeEventListener('keydown',onKey);res(v);};
    const onKey=e=>{if(e.key==='Escape')done(false);};
    bg.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-m]');if(b)done(b.dataset.m==='1');else if(e.target===bg)done(false);});
    document.addEventListener('keydown',onKey);
    document.body.appendChild(bg);bg.querySelector('[data-m="0"]').focus();
  });
}

/* ===== إشعار الورثة (واتساب / SMS) ===== */
const APP_URL=location.origin+location.pathname;
function txLines(t){
  const A=ACCTS[t.acct]||{name:''},L=[];
  if(t.kind==='dep'){L.push('📥 إيداع في '+A.name,'المبلغ: '+fmt(t.amount)+' د.إ');if(t.from)L.push('من: '+t.from);}
  else if(t.kind==='exp'){L.push('📤 مصروف من '+A.name,'البند: '+(t.from||'—'),'المبلغ: '+fmt(t.amount)+' د.إ');}
  else if(t.kind==='dist'){L.push(t.hist?'💰 توزيع سابق على الورثة':'💰 توزيع على الورثة من '+A.name,'الإجمالي: '+fmt(t.amount)+' د.إ');
    HEIRS.forEach(h=>{const v=+((t.alloc||{})[h.id])||0;if(v>0)L.push('• '+h.n+': '+fmt(v));});}
  L.push('التاريخ: '+dTime(t.date));if(t.note)L.push('ملحوظة: '+t.note);
  return L;
}
function notifyMsg(action,t,list){
  const r=calc(list);
  const head=action==='edit'?['✏️ تم تعديل حركة']:action==='del'?['🗑️ تم حذف حركة']:[];
  return [...head,...txLines(t),'','الرصيد المتاح الآن:','البناية: '+fmt(r.bal.bld)+' د.إ','المزارع: '+fmt(r.bal.farm)+' د.إ','','التفاصيل في تطبيق وريث:',APP_URL].join('\n');
}
const waIcon='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.6-.3z"/></svg>';
const smsIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>';
function openNotify(text){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="nT">
    <h4 id="nT">إشعار الورثة</h4><p>راجع الرسالة، عدّلها لو تبي، واختر طريقة الإرسال. في الواتساب اختر قروب العائلة.</p>
    <textarea id="nTxt" dir="rtl" style="margin-top:10px;min-height:170px;font-size:14px;line-height:1.6"></textarea>
    <div class="actions"><a class="nbtn wa" target="_blank" rel="noopener">${waIcon}واتساب</a><a class="nbtn sms" target="_blank" rel="noopener">${smsIcon}رسالة SMS</a></div>
    <div class="actions" style="margin-top:8px"><button class="ghost" data-n="copy">نسخ الرسالة</button><button class="ghost" data-n="close">تخطي</button></div></div>`;
  const ta=bg.querySelector('#nTxt'),wa=bg.querySelector('.wa'),sms=bg.querySelector('.sms');
  const upd=()=>{const v=ta.value;wa.href='https://wa.me/?text='+encodeURIComponent(v);sms.href='sms:?&body='+encodeURIComponent(v);};
  ta.value=text;upd();ta.addEventListener('input',upd);
  const close=()=>{bg.remove();document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape')close();};
  bg.addEventListener('click',async e=>{
    e.stopPropagation();
    if(e.target===bg){close();return;}
    if(e.target.closest('.nbtn')){setTimeout(close,400);return;}
    const b=e.target.closest('[data-n]');if(!b)return;
    if(b.dataset.n==='close'){close();return;}
    let ok=false;
    try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(x){try{ta.select();ok=document.execCommand('copy');}catch(y){}}
    toast(ok?'تم نسخ الرسالة':'ما قدرت أنسخ. حدّد النص وانسخه يدوياً');
  });
  document.addEventListener('keydown',onKey);
  document.body.appendChild(bg);
}

/* ===== إشعار تلقائي بالإيميل (Inkbox) ===== */
const notif={ref:{set:async c=>{const j=await api('cfg',{cfg:c});notif.cfg=j.cfg||c;}},cfg:null};
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function notifySubject(action,t){
  const A=ACCTS[t.acct]||{name:''};
  const base=t.kind==='dep'?`إيداع ${fmt(t.amount)} د.إ في ${A.name}`:t.kind==='exp'?`مصروف ${fmt(t.amount)} د.إ من ${A.name}`:`توزيع ${fmt(t.amount)} د.إ على الورثة`;
  return 'وريث: '+(action==='edit'?'تعديل – ':action==='del'?'حذف – ':'')+base;
}
async function afterChange(action,t,list,quiet){
  const text=notifyMsg(action,t,list),cfg=notif.cfg;
  if(cfg&&cfg.auto&&Array.isArray(cfg.emails)&&cfg.emails.length){
    try{const j=await api('notify',{subject:notifySubject(action,t),body:text});if(j.sent){toast('وصل الإشعار للورثة بالإيميل');return;}}
    catch(e){toast('ما انرسل الإيميل: '+apiErr(e));}
  }
  if(prefs.notify&&!quiet)setTimeout(()=>openNotify(text),350);
}
function emailCard(){
  const c=notif.cfg||{},list=(c.emails||[]).join('\n');
  return `<h3 class="sec">إشعار الورثة بالإيميل</h3><div class="card">

      <small>يوصل الإيميل من Gmail حقك لكل العناوين اللي تحت، وكل واحد ما يشوف عناوين الباقين. ونسخة توصلك أنت.</small></span><span class="sw"></span></button>
    <label class="k" for="nEmails">الإيميلات (كل إيميل في سطر)</label>
    <textarea id="nEmails" dir="ltr" style="min-height:120px;text-align:left" placeholder="name@example.com">${esc(list)}</textarea>
    <div class="err" id="nErr"></div>
    <div class="actions"><button class="ghost" data-act="email-save">حفظ الإيميلات</button></div>
    <p class="m" style="font-size:13px;color:var(--muted);margin:8px 0 0">الإيميلات محفوظة في ورقة الإعدادات في الشيت، وما تطلع للورثة في التطبيق.</p></div>`;
}

/* (الشيت يتحدث مباشرة من الخادم) */
const sheet={meta:null};function scheduleSync(){}function sheetCard(){return ''}function sheetPill(){return ''}

/* ===== تثبيت الصفحة الرئيسية بدون تمرير ===== */
function layoutHome(){
  const h=document.querySelector('.home'),fs=prefs.fs||1;
  syncBars();scroller.classList.remove('lock');
  if(h){
    h.style.height='';
    const avail=scroller.clientHeight/fs-16-14-1;
    const fits=h.getBoundingClientRect().height/fs<=avail+1;
    scroller.classList.toggle('lock',fits);
    if(fits){scrollTop0();h.style.height=Math.floor(avail)+'px';}
    return;
  }
  // باقي الصفحات: تثبت إذا محتواها كله داخل الشاشة (ما عدا الصفحات اللي فيها كتابة)
  const v=(store.mode==='api')?cur().v:store.mode;
  if(['form','settings','login','offline','loading'].includes(v))return;
  const last=appEl.lastElementChild;if(!last)return;
  const bottom=last.getBoundingClientRect().bottom-scroller.getBoundingClientRect().top+scroller.scrollTop;
  const fits=bottom<=scroller.clientHeight-4;
  scroller.classList.toggle('lock',fits);
  if(fits)scrollTop0();
}
window.addEventListener('resize',()=>{clearTimeout(layoutHome.t);layoutHome.t=setTimeout(layoutHome,120);});
// تحميل باقي الحركات تلقائياً لما يقرب المستخدم من آخر القائمة
scroller.addEventListener('scroll',()=>{if(mvMore.t)return;mvMore.t=requestAnimationFrame(()=>{mvMore.t=0;if(document.getElementById('mvMore')&&scroller.scrollTop+scroller.clientHeight>scroller.scrollHeight-700)mvMore();});},{passive:true});

/* ===== التنقل بالسحب (يتبع الإصبع، ويكفي سحب قصير أو سريع) ===== */
const TABS=['home','props'];
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
// السحب لليمين = القسم اللي بعده (باتجاه العقارات)، والسحب لليسار = اللي قبله (باتجاه الرئيسي). وفي الصفحات الداخلية أي سحب يرجعك.
function swipeTarget(dx){
  if(isForm()||store.mode!=='api')return null;
  if(state.stack.length>1)return 'back';
  const i=TABS.indexOf(state.stack[0].v),j=dx>0?i+1:i-1;
  return j>=0&&j<TABS.length?TABS[j]:null;
}
let sw=null;
const appEl=document.getElementById('app');
function setX(x,o){appEl.style.transform=x?`translate3d(${x.toFixed(1)}px,0,0)`:'';appEl.style.opacity=o==null?'':String(o);}
document.addEventListener('touchstart',e=>{
  sw=null;
  if(!prefs.swipe||e.touches.length!==1)return;
  if(e.target.closest('input,select,textarea,.table-wrap,.noswipe,header,nav,.modal-bg'))return;
  const p=e.touches[0];if(p.clientX<10||p.clientX>innerWidth-10)return;
  sw={x:p.clientX,y:p.clientY,dir:0,t:Date.now(),lx:p.clientX,lt:Date.now(),v:0};
  appEl.style.transition='none';
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!sw)return;const p=e.touches[0],dx=p.clientX-sw.x,dy=p.clientY-sw.y,now=Date.now();
  if(!sw.dir){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.15)sw.dir=1;else if(Math.abs(dy)>10){sw=null;return;}else return;}
  const dt=Math.max(1,now-sw.lt);sw.v=(p.clientX-sw.lx)/dt;sw.lx=p.clientX;sw.lt=now;
  if(reduceMotion)return;
  const has=!!swipeTarget(dx);
  setX(has?dx*0.9:dx*0.18,has?1-Math.min(Math.abs(dx)/(innerWidth*1.6),.35):null);
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!sw)return;const s=sw;sw=null;const p=e.changedTouches[0],dx=p.clientX-s.x,dy=p.clientY-s.y;
  const fast=Math.abs(s.v)>0.35&&Math.abs(dx)>24;
  const tg=s.dir===1&&(Math.abs(dx)>=50||fast)&&Math.abs(dx)>Math.abs(dy)?swipeTarget(dx):null;
  const W=innerWidth;
  if(!tg){appEl.style.transition=reduceMotion?'none':'transform .22s cubic-bezier(.2,.8,.2,1), opacity .22s';setX(0,null);return;}
  const dir=dx<0?-1:1;
  const go=()=>{appEl.style.transition='none';setX(0,null);if(tg==='back')back();else tab(tg);
    if(!reduceMotion&&appEl.animate)appEl.animate([{transform:`translate3d(${(-dir*W*0.35).toFixed(0)}px,0,0)`,opacity:0},{transform:'translate3d(0,0,0)',opacity:1}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});};
  if(reduceMotion){go();return;}
  appEl.style.transition='transform .14s ease-in, opacity .14s ease-in';setX(dir*W*0.6,0);
  setTimeout(go,140);
});
document.addEventListener('touchcancel',()=>{if(sw){sw=null;appEl.style.transition='transform .2s';setX(0,null);}});

applyPrefs();
store.init();
