/* ===== قراءة الهوية والجواز وخلاصة القيد: تاريخ الانتهاء ورقم المستند والاسم =====
   أولاً من الرمز اللي أسفل الجواز وخلف الهوية (MRZ) لأن فيه أرقام تحقق تأكد إن القراءة صحيحة،
   وإذا ما لقيناه: من خانة "تاريخ الانتهاء / Expiry Date"، وآخر شي: أبعد تاريخ مكتوب في المستند. */
const MRZ_DIG=s=>s.replace(/[OQDU]/g,'0').replace(/[IL|]/g,'1').replace(/Z/g,'2').replace(/S/g,'5').replace(/B/g,'8').replace(/G/g,'6').replace(/T/g,'7').replace(/A/g,'4');
function mrzCheck(s){const W=[7,3,1];let t=0;for(let i=0;i<s.length;i++){const c=s[i];const v=c==='<'?0:c>='0'&&c<='9'?+c:c>='A'&&c<='Z'?c.charCodeAt(0)-55:-1;if(v<0)return -1;t+=v*W[i%3];}return t%10;}
function mrzNorm(l){return normDig(l).toUpperCase().replace(/[«‹≤＜]/g,'<').replace(/\s+/g,'').replace(/[^A-Z0-9<]/g,'');}
function mrzDate(s,future){const y=+s.slice(0,2),m=+s.slice(2,4),d=+s.slice(4,6);if(!(m>=1&&m<=12&&d>=1&&d<=31))return '';
  const cy=new Date().getFullYear()%100;const Y=future?2000+y:(y>cy?1900+y:2000+y);return `${Y}-${pad(m)}-${pad(d)}`;}
function mrzScan(lines){
  const L=lines.map(mrzNorm).filter(l=>l.length>=20);let best=null;
  L.forEach((l,li)=>{
    for(let i=0;i+15<=l.length;i++){
      const dob=MRZ_DIG(l.slice(i,i+6)),c1=MRZ_DIG(l[i+6]),sx=l[i+7],exp=MRZ_DIG(l.slice(i+8,i+14)),c2=MRZ_DIG(l[i+14]);
      if(!/^\d{6}$/.test(dob)||!/^\d{6}$/.test(exp)||!/^\d$/.test(c1)||!/^\d$/.test(c2))continue;
      if(!/[MF<XKN]/.test(sx))continue;
      const e=mrzDate(exp,true),b=mrzDate(dob,false);if(!e||!b)continue;
      const okE=mrzCheck(exp)===+c2,okB=mrzCheck(dob)===+c1;
      const score=(okE?2:0)+(okB?1:0)+(l.indexOf('<')>=0?.5:0);
      if(!best||score>best.score)best={score,okE,okB,expiry:e,dob:b,li,i,line:l};
    }
  });
  if(!best||best.score<1.5)return null;  // لازم على الأقل تحقق تاريخ الانتهاء أو تحقق الميلاد مع شكل الرمز
  const r={expiry:best.expiry,dob:best.dob,sure:best.okE,kind:''};
  const l=best.line,i=best.i,all=L.join('\n');
  // جواز (سطرين 44 حرف): رقم الجواز قبل تاريخ الميلاد بـ 13 حرف
  if(i>=13){const no=l.slice(i-13,i-4),c=MRZ_DIG(l[i-4]);if(/^[A-Z0-9<]{9}$/.test(no)&&/^[A-Z0-9]/.test(no)){r.kind='td3';const n=no.replace(/<+$/,'');if(mrzCheck(no)===+c||/^[A-Z]?\d{6,9}$/.test(n))r.no=n;}}
  else r.kind='td1';
  // اسم الجواز: السطر اللي يبدأ بـ P<
  const pl=L.find(x=>/^P[A-Z<][A-Z<]{3}[A-Z]/.test(x));
  if(pl){r.kind='td3';r.nameEn=mrzName(pl.slice(5));}
  // الهوية: سطر الاسم بعد سطر التاريخ، ورقم الهوية 784 في السطر الأول
  if(r.kind==='td1'){const nl=L[best.li+1];if(nl&&/^[A-Z<]{10,}$/.test(nl)&&nl.indexOf('<<')>0)r.nameEn=mrzName(nl);
    const m=/784\d{12}/.exec(MRZ_DIG(all.replace(/[^A-Z0-9<\n]/g,'')));if(m)r.eid=m[0];}
  return r;
}
function mrzName(s){const p=s.split('<<').filter(Boolean);if(!p.length)return '';
  const sur=p[0].replace(/</g,' ').trim(),giv=(p[1]||'').replace(/</g,' ').trim();
  const t=(giv?giv+' ':'')+sur;return /[A-Z]{2}/.test(t)?t.replace(/\s+/g,' ').replace(/\b([A-Z])([A-Z]*)/g,(m,a,b)=>a+b.toLowerCase()):'';}
const RE_DEXP=/expiry|expiration|exp\.?\s*date|date\s*of\s*exp|valid\s*(?:until|thru|till|to)|انتهاء|الانتهاء|الإنتهاء|إنتهاء|ينتهي|تنتهي|صالح[ةه]?\s*(?:حتى|لغاية|إلى)/i;
const RE_DISS=/issu|إصدار|الاصدار|الإصدار|اصدار|تاريخ\s*التحرير/i;
const RE_DDOB=/birth|ميلاد|الميلاد/i;
function labelDate(lines,re,skip){
  for(let i=0;i<lines.length;i++){const l=normDig(lines[i]);const m=re.exec(l);if(!m)continue;
    if(skip&&skip.test(l)&&!re.test(l.replace(skip,'')))continue;
    const after=findDates(l.slice(m.index));if(after.length)return after[0].d;
    const here=findDates(l);if(here.length===1)return here[0].d;
    for(let k=1;k<=2&&i+k<lines.length;k++){const n=findDates(normDig(lines[i+k]));if(n.length)return n[0].d;}
  }
  return '';
}
// بعض الصور يقرأها التطبيق أعمدة: كل أسماء الخانات أول، بعدين كل القيم بنفس الترتيب
function colPairs(lines){
  const isLab=l=>/[:：]\s*$/.test(l)&&!/\d/.test(normDig(l));
  for(let i=0;i<lines.length;i++){if(!isLab(lines[i]))continue;let j=i;while(j<lines.length&&isLab(lines[j]))j++;
    const n=j-i;if(n>=2&&j+n<=lines.length)return lines.slice(i,j).map((l,k)=>l+' '+lines[j+k]);i=j;}
  return [];
}
function parseIdDoc(lines,type){
  lines=(lines||[]).map(s=>String(s||'').trim()).filter(Boolean);
  const r={expiry:'',how:'',sure:false,issue:'',no:'',name:''};
  const mrz=mrzScan(lines);
  if(mrz){r.expiry=mrz.expiry;r.how='mrz';r.sure=mrz.sure;if(mrz.no&&type==='passport')r.no=mrz.no;if(mrz.eid&&type==='eid')r.no=mrz.eid;if(mrz.nameEn)r.name=mrz.nameEn;}
  const pairs=colPairs(lines);
  const lab=(pairs.length&&labelDate(pairs,RE_DEXP))||labelDate(lines,RE_DEXP);
  if(!r.expiry&&lab){r.expiry=lab;r.how='label';}
  else if(r.expiry&&!r.sure&&lab&&lab!==r.expiry){r.expiry=lab;r.how='label';}
  r.issue=(pairs.length&&labelDate(pairs,RE_DISS,RE_DEXP))||labelDate(lines,RE_DISS,RE_DEXP);
  if(!r.expiry){const ds=[];lines.forEach(l=>findDates(normDig(l)).forEach(x=>ds.push(x.d)));ds.sort();
    const last=ds[ds.length-1];if(last&&last!==r.issue&&ds.length>=2){r.expiry=last;r.how='latest';}}
  if(r.issue&&r.expiry&&r.issue>=r.expiry)r.issue='';
  const txt=lines.concat(pairs).map(normDig).join('\n');
  if(type==='eid'&&!r.no){const m=/784[\s\-–.]*\d{4}[\s\-–.]*\d{7}[\s\-–.]*\d/.exec(txt);if(m)r.no=m[0].replace(/\D/g,'');}
  if(type==='eid'&&r.no&&/^784\d{12}$/.test(r.no))r.no=r.no.replace(/^(\d{3})(\d{4})(\d{7})(\d)$/,'$1-$2-$3-$4');
  if(type==='passport'&&!r.no){const m=/(?:passport\s*no\.?|رقم\s*الجواز)[^A-Z0-9]{0,12}([A-Z]?\d{6,9})/i.exec(txt);if(m)r.no=m[1].toUpperCase();}
  if(type==='family'){const m=/(?:رقم\s*(?:الخلاصة|خلاصة\s*القيد|القيد|العائلة)|family\s*(?:book\s*)?no\.?|khulasat[^\n]*no\.?)[^\d\n]{0,14}(\d{2,12})/i.exec(txt);if(m)r.no=m[1];}
  if(!r.name){const m=/(?:^|\n)\s*(?:الاسم|name)[ \t]*[:：]?[ \t]*([^\n:]{4,60})/i.exec(txt);if(m)r.name=m[1].replace(/[|_]+/g,' ').replace(/\s+/g,' ').trim();}
  return r;
}

/* ===== المستندات الشخصية: الهوية الإماراتية، جواز السفر، خلاصة القيد =====
   يشوفها: المدير، والوكيل، وصاحب المستند برقمه الخاص بس. الملفات تنحفظ في Google Drive حق المدير،
   وما تنحفظ على الجهاز أبداً (تنفتح من الخادم وقت العرض بس). */
const DOC_T={
  eid:{n:'الهوية الإماراتية',s:'الهوية',hint:'صوّر الوجه الأمامي والخلفي (الخلفي فيه الرمز اللي يتأكد منه التطبيق)',more:'إضافة الوجه الخلفي'},
  passport:{n:'جواز السفر',s:'الجواز',hint:'صوّر صفحة البيانات اللي فيها صورتك والسطرين اللي تحتها',more:'إضافة صفحة ثانية'},
  family:{n:'خلاصة القيد',s:'خلاصة القيد',hint:'صوّر الصفحات أو اختر ملف PDF',more:'إضافة صفحة ثانية'}};
const DOC_ORDER=['eid','passport','family'],DOC_WARN=60,DOCW_KEY='wareeth-docwarn',DOCSEEN_KEY='wareeth-docseen';
const docsOn=()=>store.mode==='api'&&Array.isArray(store.docs)&&(store.canWrite||store.isAgent||(isHeirUser()&&!!H[store.user.heir]));
const docsAll=()=>store.canWrite||store.isAgent;
const docsOf=h=>(store.docs||[]).filter(d=>d.heir===h);
function docDays(d){if(!d||d.noExp||!/^\d{4}-\d{2}-\d{2}$/.test(d.expiry||''))return null;
  return Math.round((new Date(d.expiry+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);}
function docState(d){if(!d)return 'none';const n=docDays(d);return n==null?'ok':n<0?'exp':n<=DOC_WARN?'soon':'ok';}
const docDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?fmtDT(s):'';
function docLeft(n){if(n==null)return 'بدون تاريخ انتهاء';if(n<0)return 'منتهية من '+(-n)+' يوم';if(n===0)return 'تنتهي اليوم';if(n===1)return 'تنتهي بكرة';
  if(n<=DOC_WARN)return 'باقي '+n+' يوم';const m=Math.round(n/30.4);return m<24?'سارية · باقي '+m+' شهر':'سارية · باقي '+Math.round(n/365)+' سنوات';}
function docPill(d){const s=docState(d),n=docDays(d);
  if(s==='none')return '<span class="dpill none">ما أضيف</span>';
  return `<span class="dpill ${s}">${s==='exp'?'منتهية':s==='soon'?(n===0?'اليوم':'<bdi class="num">'+n+'</bdi> يوم'):'سارية'}</span>`;}
function docSeen(){try{return +localStorage.getItem(DOCSEEN_KEY)||0;}catch(e){return 0;}}
function docMarkSeen(){try{localStorage.setItem(DOCSEEN_KEY,String(Date.now()));}catch(e){}}
function docIsNew(d){const s=docSeen();return !!s&&(+d.updatedAt||0)>s&&d.by!==(store.canWrite?'المدير':store.isAgent?store.agent:'');}

I.passport='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3.2"/><path d="M8.8 10h6.4M12 6.8c-1 .9-1.4 2-1.4 3.2s.4 2.3 1.4 3.2c1-.9 1.4-2 1.4-3.2S13 7.7 12 6.8M9 17h6"/></svg>';

const DOC_IC={eid:()=>I.idcard,passport:()=>I.passport,family:()=>I.family};
function docSum(list){
  const ex=list.filter(d=>docState(d)==='exp').length,so=list.filter(d=>docState(d)==='soon');
  return {ex,soon:so.length,minN:so.length?Math.min(...so.map(docDays)):null};
}
/* تنبيه المستندات في الرئيسية: يطلع بس إذا فيه مستند منتهي أو باقي له شهرين أو أقل */
function docLine(){
  if(!docsOn())return '';
  const all=docsAll(),L=(all?store.docs:docsOf(store.user.heir)).map(d=>({d,n:docDays(d)})).filter(x=>x.n!=null&&x.n<=DOC_WARN).sort((a,b)=>a.n-b.n);
  if(!L.length)return '';
  const f=L[0],ex=f.n<0,nm=x=>(all?DOC_T[x.d.type].s+' '+H[x.d.heir].n:DOC_T[x.d.type].n);
  const t=L.length>1?`${L.length} مستندات ${L.some(x=>x.n<0)?'تحتاج تجديد':'قرب تنتهي'}`:nm(f);
  const sub=(L.length>1?'أقربها: '+nm(f)+' · ':'')+(ex?'منتهية، جدّدها':'تنتهي '+docDate(f.d.expiry));
  return `<button class="docline alert${ex?' exp':''}" data-go="docs"><span class="ic">${I.idcard}</span><span class="dl-t">${esc(t)}<small>${esc(sub)}</small></span><span class="dpill ${ex?'exp':'soon'}">${ex?'منتهية':f.n===0?'اليوم':'<bdi class="num">'+f.n+'</bdi> يوم'}</span>${I.chev}</button>`;
}
V.docs=()=>{

  const all=store.docs,s=docSum(all);
  const alerts=all.map(d=>({d,n:docDays(d)})).filter(x=>x.n!=null&&x.n<=DOC_WARN).sort((a,b)=>a.n-b.n);
  const html=`${alerts.length?`<div class="card docalert"><h4>${s.ex?'⛔':'⚠️'} ${alerts.length===1?'مستند يحتاج تجديد':alerts.length+' مستندات تحتاج تجديد'}</h4>
    ${alerts.map(({d,n})=>`<button class="row" data-go="docheir" data-id="${d.heir}"><span>${esc(H[d.heir].n)} – ${DOC_T[d.type].n}<div class="m">${esc(docLeft(n))} · ${esc(docDate(d.expiry))}</div></span>${docPill(d)}</button>`).join('')}</div>`:''}

      <div class="dchips">${DOC_ORDER.map(t=>{const d=L.find(x=>x.type===t),st=docState(d);return `<span class="dchip ${st}">${DOC_T[t].s}</span>`;}).join('')}</div></span>${I.chev}</button>`;}).join('')}</div>

function docPrivacy(){return `<p class="note docpriv">${I.lock}<span>المستندات ما يشوفها إلا صاحبها والمدير و${esc(store.agent||'الوكيل')}. تنحفظ في مجلد خاص في Google Drive حق المدير، وما تنحفظ على الجوال. التطبيق يرسل تنبيه قبل انتهاء أي مستند بشهرين، وما يقبل مستند منتهي.</span></p>`;}

    if(!d)return `<div class="card doc none"><div class="doc-h"><span class="doc-ic">${DOC_IC[t]()}</span><div><h4>${DOC_T[t].n}</h4><div class="m">ما أضيف للحين</div></div>${docPill(null)}</div>
      <p class="m doc-hint">${DOC_T[t].hint}</p>

    const dl=[['تاريخ الانتهاء',d.noExp?'بدون تاريخ انتهاء':docDate(d.expiry)],['تاريخ الإصدار',docDate(d.issue)],['رقم المستند',d.no,1],['الاسم',d.name]].filter(x=>x[1]);
    return `<div class="card doc ${st}"><div class="doc-h"><span class="doc-ic">${DOC_IC[t]()}</span><div><h4>${DOC_T[t].n}${docIsNew(d)?' <span class="ntag">جديد</span>':''}</h4><div class="m">${esc(docLeft(n))}</div></div>${docPill(d)}</div>
      ${st==='exp'?`<div class="doc-warn exp">⛔ هذي الوثيقة منتهية. جدّدها وصوّر الجديدة.</div>`:st==='soon'?`<div class="doc-warn soon">⚠️ تنتهي ${n===0?'اليوم':'بعد '+n+' يوم'}. لا تنسى تجددها.</div>`:''}
      <dl>${dl.map(([k,v,num])=>`<dt>${k}</dt><dd${num?' class="num"':''}>${esc(v)}</dd>`).join('')}</dl>
      <div class="m doc-by">${d.src==='ocr'?'التاريخ مقروء من المستند':'التاريخ مكتوب يدوي'} · أضافه ${esc(d.by||'')}${d.updatedAt?' · '+esc(fmtDT(new Date(+d.updatedAt))):''}</div>
      <div class="actions"><button class="ghost" data-act="doc-view" data-id="${esc(d.id)}">عرض المستند${d.pages>1?' ('+d.pages+')':''}</button>${up(st==='ok'?'تحديث':'تجديد',st==='ok'?'ghost':'primary docup-main')}</div>
      <div class="doc-more"><button class="linkbtn" data-act="doc-edit" data-id="${esc(d.id)}">تعديل البيانات</button><button class="linkbtn neg" data-act="doc-del" data-id="${esc(d.id)}">حذف</button></div></div>`;
  }).join('');
  setTimeout(docMarkSeen,1500);
  return {title:mine?'مستنداتي':'مستندات '+h.n,html:`${mine?'':`<p class="doc-who">${esc(h.full||h.n)}</p>`}${cards}${docPrivacy()}`};
};

async function imgCanvas(file,max){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('ما قدرت أفتح الصورة. جرّب صورة JPG أو PNG أو ملف PDF.'));i.src=url;});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);return c;}
  finally{URL.revokeObjectURL(url);}
}
function cvRot(c,deg){const o=document.createElement('canvas'),q=deg%180!==0;o.width=q?c.height:c.width;o.height=q?c.width:c.height;
  const g=o.getContext('2d');g.translate(o.width/2,o.height/2);g.rotate(deg*Math.PI/180);g.drawImage(c,-c.width/2,-c.height/2);return o;}
function cvBottom(c,frac){const h=Math.round(c.height*frac),k=Math.min(2,2200/c.width),o=document.createElement('canvas');o.width=Math.round(c.width*k);o.height=Math.round(h*k);
  const g=o.getContext('2d');g.filter='grayscale(1) contrast(1.35)';g.drawImage(c,0,c.height-h,c.width,h,0,0,o.width,o.height);return o;}
const b64of=dataUrl=>String(dataUrl).split(',')[1]||'';
async function fileB64(f){const u8=new Uint8Array(await f.arrayBuffer());let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
/* يجهّز الصفحة: صورة مضغوطة للحفظ + نص مقروء */
async function docPage(f,prog){
  const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name||'');
  if(isPdf){if(f.size>8*1024*1024)throw new Error('ملف PDF أكبر من 8 ميجا. صوّر المستند بدل الملف.');
    const lines=await pdfLines(f,prog);return {mime:'application/pdf',data:await fileB64(f),thumb:'',name:f.name||'PDF',lines,cv:null};}
  const cv=await imgCanvas(f,1800),thumb=(await imgCanvas(f,240)).toDataURL('image/jpeg',.7);
  const data=b64of(cv.toDataURL('image/jpeg',.85));
  const lines=await ocrLines(cv,prog);
  return {mime:'image/jpeg',data,thumb,lines,cv};
}
/* إذا ما لقينا تاريخ أكيد: نقرأ الجزء السفلي مكبّر (رمز الجواز/الهوية)، وبعدين نجرّب الصورة مقلوبة */
async function docDeepen(df,prog){
  for(const pg of df.pages){if(!pg.cv)continue;
    let r=parseIdDoc(df.pages.flatMap(p=>p.lines),df.type);if(r.how==='mrz'&&r.sure)return;
    if(df.type!=='family'){prog('أقرأ الرمز اللي أسفل المستند…');pg.lines=pg.lines.concat(await ocrLines(cvBottom(pg.cv,.38),prog));}
    r=parseIdDoc(df.pages.flatMap(p=>p.lines),df.type);if(r.expiry&&r.how!=='latest')return;
    for(const deg of [90,270]){prog('أعدّل اتجاه الصورة…');const L=await ocrLines(cvRot(pg.cv,deg),prog);const t=parseIdDoc(L,df.type);
      if(t.expiry&&t.how!=='latest'){pg.lines=pg.lines.concat(L);if(df.type!=='family'&&t.how!=='mrz'){const L2=await ocrLines(cvBottom(cvRot(pg.cv,deg),.38),prog);pg.lines=pg.lines.concat(L2);}return;}}
  }
}
function docApplyParse(df){
  const r=parseIdDoc(df.pages.flatMap(p=>p.lines||[]),df.type);df.ocr=r;
  if(r.expiry&&!df.manualExp)df.expiry=r.expiry;
  if(r.issue&&!df.issue)df.issue=r.issue;
  if(r.no&&!df.no)df.no=r.no;
  if(r.name&&!df.name)df.name=r.name;
  df.src=df.expiry&&df.expiry===r.expiry?'ocr':'manual';
}
async function docScan(files,heir,type,add){
  files=[...files].slice(0,4);if(!files.length)return;
  if(store.ver<7){toast('حدّث كود الخادم (Code) للإصدار الجديد عشان تقدر تضيف مستندات.');return;}
  let df=add&&state.df&&state.df.heir===heir&&state.df.type===type?state.df:null;
  if(!df){const old=docsOf(heir).find(d=>d.type===type);
    df={heir,type,pages:[],no:'',name:'',issue:'',expiry:'',noExp:false,src:'manual',manualExp:false,renew:!!old,ocr:null};}
  if(df.pages.length+files.length>4){toast('أكثر شي 4 صفحات للمستند.');files=files.slice(0,4-df.pages.length);if(!files.length)return;}
  const done=busy('جاري قراءة '+DOC_T[type].n+'…','أول مرة تاخذ وقت أطول');const prog=m=>{const s=document.querySelector('#busy small');if(s)s.textContent=m;};
  try{for(const [i,f] of files.entries()){const pre=files.length>1?`صفحة ${i+1} من ${files.length}: `:'';df.pages.push(await docPage(f,m=>prog(pre+m)));}
    await docDeepen(df,prog);}
  catch(e){done();toast((e&&e.message)||'ما قدرت أقرأ المستند.');if(!df.pages.length)return;}
  done();
  docApplyParse(df);state.df=df;
  if(cur().v==='docform')render();else go('docform');
}
/* ---------- صفحة إضافة / تجديد مستند ---------- */
function docCheck(df){
  const o=df.ocr;
  if(!df.keep&&df.pages.length&&o&&o.sure&&o.expiry&&o.expiry<todayStr())return {ok:false,cls:'exp',msg:`⛔ الوثيقة منتهية بتاريخ ${docDate(o.expiry)} (مقروء من رمز المستند ومتأكد منه). التطبيق ما يقبلها، جدّدها وصوّر الجديدة.`};
  if(df.type==='family'&&df.noExp)return {ok:true,cls:'ok',msg:'خلاصة القيد بدون تاريخ انتهاء.'};
  if(!df.expiry)return {ok:false,cls:'none',msg:'اختر تاريخ الانتهاء المكتوب في المستند.'};
  const n=Math.round((new Date(df.expiry+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);
  if(n<0)return {ok:false,cls:'exp',msg:`⛔ هذي الوثيقة منتهية بتاريخ ${docDate(df.expiry)}. التطبيق ما يقبل وثيقة منتهية، جدّدها وصوّر الجديدة.`};
  if(n<=DOC_WARN)return {ok:true,cls:'soon',msg:`⚠️ تنتهي ${n===0?'اليوم':'بعد '+n+' يوم'} (${docDate(df.expiry)}). تنحفظ، والتطبيق بيذكّرك تجددها.`};
  return {ok:true,cls:'ok',msg:`✓ سارية لين ${docDate(df.expiry)}.`};
}
function docOcrNote(df){
  const r=df.ocr;if(!df.pages.length)return '';
  if(!r||!r.expiry)return `<div class="doc-ocr none">ما قدرت أقرأ تاريخ الانتهاء من الصورة. اختره تحت${df.type==='family'?'، أو اختر "ما لها تاريخ انتهاء"':''}، أو صوّر المستند أوضح.</div>`;
  const how=r.how==='mrz'?(r.sure?'من الرمز اللي '+(df.type==='passport'?'أسفل الجواز':'خلف الهوية')+'، وتأكدت منه بأرقام التحقق':'من الرمز اللي أسفل المستند'):r.how==='label'?'من خانة تاريخ الانتهاء':'من أبعد تاريخ مكتوب في المستند';
  const en=(HEIR_EN[df.heir]||'').toLowerCase(),nm=String(r.name||'').toLowerCase(),ar=H[df.heir].n;
  const sk=x=>x.replace(/[^a-z]/g,'').replace(/[aeiouyw]/g,'').replace(/(.)\1+/g,'$1');
  const mism=nm&&(/[a-z]/.test(nm)?en&&!nm.split(/\s+/).some(w=>sk(w)===sk(en)):nm.indexOf(ar)<0);
  return `${mism?`<div class="doc-ocr none">⚠️ الاسم المقروء (${esc(r.name)}) ما يشبه اسم ${esc(ar)}. تأكد إن المستند له.</div>`:''}<div class="doc-ocr ${r.sure?'ok':'mid'}">📄 قرأت تاريخ الانتهاء <b>${esc(docDate(r.expiry))}</b> ${how}.${r.sure?'':' تأكد منه قبل الحفظ.'}${df.manualExp&&df.expiry!==r.expiry?'<br>غيّرته يدوي، فينحفظ كتاريخ مكتوب يدوي.':''}</div>`;
}

function readDF(){const df=state.df;if(!df)return;const v=id=>{const e=document.getElementById(id);return e?e.value:null;};
  if(v('df_no')!=null)df.no=v('df_no').trim();if(v('df_name')!=null)df.name=v('df_name').trim();
  if(v('df_exp')!=null){const e=v('df_exp');if(e!==df.expiry){df.expiry=e;df.manualExp=!!(df.ocr&&df.ocr.expiry)?e!==df.ocr.expiry:true;}}
  if(v('df_iss')!=null)df.issue=v('df_iss');
  df.src=!df.noExp&&df.expiry&&df.ocr&&df.ocr.expiry===df.expiry?'ocr':'manual';}
function updDF(){const df=state.df,el=document.getElementById('dfState'),b=document.getElementById('dfSave');if(!df||!el)return;
  const c=docCheck(df);el.className='doc-check '+c.cls;el.textContent=c.msg;if(b)b.disabled=!(c.ok&&(df.pages.length||df.keep));
  const o=document.querySelector('.doc-ocr');if(o&&df.ocr&&df.ocr.expiry){const t=document.createElement('div');t.innerHTML=docOcrNote(df);o.replaceWith(t.firstElementChild);}}
async function docAction(act,b){
  if(act==='doc-noexp'){readDF();state.df.noExp=!state.df.noExp;render();return;}
  if(act==='doc-pg-del'){readDF();state.df.pages.splice(+b.dataset.i,1);docApplyParse(state.df);render();return;}
  if(act==='doc-edit'){const d=(store.docs||[]).find(x=>x.id===b.dataset.id);if(!d)return;
    state.df={heir:d.heir,type:d.type,pages:[],keep:true,no:d.no||'',name:d.name||'',issue:d.issue||'',expiry:d.expiry||'',noExp:!!d.noExp,src:d.src,manualExp:false,ocr:d.src==='ocr'?{expiry:d.expiry,sure:true}:null};go('docform');return;}
  if(act==='doc-view'){docView(b.dataset.id);return;}
  if(act==='doc-del'){const d=(store.docs||[]).find(x=>x.id===b.dataset.id);if(!d)return;
    if(!await ask('حذف '+DOC_T[d.type].n,'ينحذف المستند وصوره من '+H[d.heir].n+'. تقدر تضيفه من جديد بعدين.','حذف'))return;
    const done=busy('جاري الحذف…');
    try{const r=await api('doc-del',{id:d.id});done();if(!store.applyRes(r))await store.refresh();render();toast('تم حذف '+DOC_T[d.type].n);}
    catch(e){done();toast('ما انحذف: '+apiErr(e));}return;}
  if(act==='doc-save'){
    readDF();const df=state.df,err=document.getElementById('dfErr'),c=docCheck(df);
    if(!c.ok){err.textContent=c.msg;return;}
    if(!df.keep&&!df.pages.length){err.textContent='صوّر المستند أو اختر ملف.';return;}
    const doc={heir:df.heir,type:df.type,no:df.no,name:df.name,issue:df.issue||'',expiry:df.noExp?'':df.expiry,noExp:!!df.noExp,src:df.src};
    const files=df.keep?[]:df.pages.map(p=>({mime:p.mime,data:p.data}));
    const done=busy('جاري حفظ '+DOC_T[df.type].n+'…',files.length?'يرفع الصور بأمان':'');
    try{const r=await api('doc-put',{doc,files});done();
      if(!store.applyRes(r))await store.refresh();

    catch(e){done();err.textContent=e&&e.error==='expired'?'⛔ الخادم رفض المستند لأنه منتهي ('+docDate(e.expiry)+'). جدّده وصوّر الجديد.':'ما انحفظ: '+apiErr(e);}
    return;}
}
/* ---------- عرض المستند (من الخادم، وما ينحفظ على الجهاز) ---------- */
async function docView(id){
  const d=(store.docs||[]).find(x=>x.id===id);if(!d)return;
  const done=busy('جاري فتح المستند…');let r;
  try{r=await api('doc-file',{id});}catch(e){done();toast('ما قدرت أفتح المستند: '+apiErr(e));return;}
  const imgs=[],blobs=[];
  try{for(const p of r.pages||[]){
      const bin=atob(p.data),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);blobs.push(new Blob([u8],{type:p.mime}));
      if(p.mime==='application/pdf'){await loadScript(PDFJS);const L=window.pdfjsLib;L.GlobalWorkerOptions.workerSrc=PDFJS_W;
        const doc=await L.getDocument({data:u8}).promise;
        for(let k=1;k<=Math.min(doc.numPages,6);k++){const pg=await doc.getPage(k),vp=pg.getViewport({scale:2}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
          await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;imgs.push(cv.toDataURL('image/jpeg',.88));}}
      else imgs.push('data:'+p.mime+';base64,'+p.data);}}
  catch(e){done();toast('ما قدرت أعرض الملف.');return;}
  done();
  const t=DOC_T[d.type],nm=H[d.heir].n+' – '+t.n;
  const bg=document.createElement('div');bg.className='modal-bg docviewbg';
  bg.innerHTML=`<div class="modal sheet docview" role="dialog" aria-modal="true" aria-labelledby="dvT"><div class="sheet-grip"></div>
    <div class="hc-head"><h4 id="dvT">${esc(nm)}</h4><button class="zreset num" data-zr hidden aria-label="رجوع للحجم العادي">100%</button><button class="iconbtn hc-x" data-dv="close" aria-label="إغلاق">✕</button></div>
    <div class="hc-vp"><div class="hc-sizer"><div class="hc-body">${imgs.map((s,i)=>`<img class="dv-img" src="${s}" alt="${esc(nm)} صفحة ${i+1}">`).join('')}</div></div></div>
    <div class="actions"><button class="ghost" data-dv="save">حفظ نسخة</button><button class="ghost" data-dv="close">إغلاق</button></div></div>`;
  const close=()=>{bg.remove();document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape')close();};
  bg.addEventListener('click',async e=>{e.stopPropagation();if(e.target===bg){close();return;}const b=e.target.closest('[data-dv]');if(!b)return;
    if(b.dataset.dv==='close'){close();return;}
    const files=blobs.map((bl,i)=>new File([bl],`${nm}${blobs.length>1?' '+(i+1):''}.${bl.type==='application/pdf'?'pdf':'jpg'}`,{type:bl.type}));
    try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title:nm});return;}}catch(x){if(x&&x.name==='AbortError')return;}
    files.forEach(f=>{const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);});});
  document.addEventListener('keydown',onKey);document.body.appendChild(bg);
  const sh=bg.querySelector('.modal.sheet');sheetSwipe(sh,close,bg.querySelector('.hc-vp'));
  let n=0;const imgsEl=[...bg.querySelectorAll('.dv-img')],ready=()=>{if(++n>=imgsEl.length)pageZoom(sh);};
  imgsEl.forEach(im=>{if(im.complete)ready();else{im.onload=ready;im.onerror=ready;}});if(!imgsEl.length)pageZoom(sh);
}

/* نافذة تأكيد داخل الصفحة (نوافذ المتصفح confirm محجوبة داخل التطبيق) */
function ask(title,msg,okLabel){
  return new Promise(res=>{
    const bg=document.createElement('div');bg.className='modal-bg';
    bg.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mT"><h4 id="mT"></h4><p></p>
      <div class="actions"><button class="ghost" data-m="0">إلغاء</button><button class="btn-danger" data-m="1"></button></div></div>`;
    bg.querySelector('h4').textContent=title;bg.querySelector('p').textContent=msg||'';bg.querySelector('.btn-danger').textContent=okLabel||'تأكيد';
    const done=v=>{bg.remove();document.removeEventListener('keydown',onKey);res(v);};
    const onKey=e=>{if(e.key==='Escape')done(false);};
    bg.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-m]');if(b)done(b.dataset.m==='1');else if(e.target===bg)done(false);});
    document.addEventListener('keydown',onKey);
    document.body.appendChild(bg);bg.querySelector('[data-m="0"]').focus();
  });
}

function normPhone(x){

    ${HEIRS.map(h=>`<div class="phrow"><label for="ph-${h.id}">${esc(h.n)}</label><input id="ph-${h.id}" data-ph="${h.id}" type="tel" inputmode="tel" autocomplete="off" placeholder="05XXXXXXXX" value="${esc(showPhone(p[h.id]))}"></div>`).join('')}

}

/* ===== إشعار تلقائي بالإيميل (Inkbox) ===== */
const notif={ref:{set:async c=>{const j=await api('cfg',{cfg:c});notif.cfg=j.cfg||c;}},cfg:null};
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function notifySubject(action,t){
  const A=ACCTS[t.acct]||{name:''};
  const base=t.kind==='dep'?`إيداع ${fmt(t.amount)} د.إ في ${A.name}`:t.kind==='exp'?`مصروف ${fmt(t.amount)} د.إ من ${A.name}`:`توزيع ${fmt(t.amount)} د.إ على الورثة`;
  return 'وريث: '+(action==='edit'?'تعديل – ':action==='del'?'حذف – ':'')+base;
}
function waOn(){const w=notif.cfg&&notif.cfg.wa;return !!(w&&w.ready&&w.auto&&w.tpl==='APPROVED');}
/* بيانات الرسالة التلقائية (القالب المعتمد عند ميتا) */
function waPayload(action,t,list){
  const A=ACCTS[t.acct]||{name:''},r=calc(list);
  const base=t.kind==='dep'?['إيداع','في '+A.name]:t.kind==='exp'?['مصروف','من '+A.name]:t.hist?['توزيع سابق على الورثة','']:['توزيع على الورثة','من '+A.name];
  const what=(action==='edit'?'تعديل ':action==='del'?'حذف ':'')+base[0]+(action==='new'&&!t.hist?' جديد':'')+(base[1]?' '+base[1]:'');
  let detail=t.kind==='dep'?(t.from?'من: '+t.from:''):t.kind==='exp'?'البند: '+(t.from||'—'):'';
  const alloc={};if(t.kind==='dist'){let n=0;HEIRS.forEach(h=>{const v=+((t.alloc||{})[h.id])||0;if(v>0){alloc[h.id]=fmt(v);n++;}});detail='على '+n+' ورثة';}
  if(t.note)detail=(detail?detail+' — ':'')+t.note;
  return {wa:{what,amount:fmt(t.amount),detail:(detail||'—').slice(0,200),date:dTime(t.date),bld:fmt(r.bal.bld),farm:fmt(r.bal.farm),alloc}};
}
async function afterChange(action,t,list,quiet){
  const text=notifyMsg(action,t,list),cfg=notif.cfg||{};
  let manual=prefs.notify&&!quiet,only=null;
  if(cfg.auto&&Array.isArray(cfg.emails)&&cfg.emails.length){
    try{const j=await api('notify',{subject:notifySubject(action,t),body:text});if(j.sent){toast('وصل الإشعار للورثة بالإيميل');if(!heirPhones().length)manual=false;}}
    catch(e){toast('ما انرسل الإيميل: '+apiErr(e));}
  }
  if(waOn()&&heirPhones().length){
    try{const j=await api('wa',waPayload(action,t,list));
      if(j.off){/* انطفى من الخادم: نكمل يدوي */}
      else{const bad=j.failed||[];
        if(!bad.length){toast('✓ وصل الواتساب لـ '+(j.sent||0)+' ورثة');manual=false;}
        else{toast((j.sent?'وصل لـ '+j.sent+'، و':'')+'ما وصل لـ '+bad.length+': '+bad[0].why);only=bad.map(x=>x.id);manual=prefs.notify;}}
    }catch(e){toast('ما انرسل الواتساب التلقائي: '+apiErr(e));manual=prefs.notify;}
  }
  if(manual)setTimeout(()=>openNotify(text,only,waPayload(action,t,list)),350);
}
/* إعداد الواتساب التلقائي (للمدير) */
function waCard(){
  const w=(notif.cfg&&notif.cfg.wa)||{},n=heirPhones().length;
  const st=w.tpl==='APPROVED'?'<b style="color:var(--pos)">✓ معتمد</b>':w.tpl==='REJECTED'?'<b style="color:var(--neg)">مرفوض</b>':w.tpl==='PAUSED'||w.tpl==='DISABLED'?'<b style="color:var(--neg)">موقوف من ميتا</b>':w.tpl?'<b style="color:var(--gold)">بانتظار موافقة ميتا</b>':'<b style="color:var(--muted)">—</b>';
  if(!w.ready)return `<h3 class="sec" id="waSec">الواتساب التلقائي</h3><div class="card">
    <p class="m" style="font-size:14px;color:var(--muted);margin:0 0 12px">بعد الربط، كل حركة توصل لكل وارث في الواتساب بنفسها، بدون ما تضغط شي. يحتاج حساب واتساب للأعمال من ميتا (الخطوات في الشرح اللي وصلك).</p>
    <label class="k" for="waTok">مفتاح الدخول الدائم (Access Token)</label>
    <input id="waTok" type="password" autocomplete="off" dir="ltr" style="text-align:left" placeholder="EAA…">
    <label class="k" for="waPid">Phone number ID</label>
    <input id="waPid" inputmode="numeric" autocomplete="off" dir="ltr" style="text-align:left" placeholder="1234567890…">
    <label class="k" for="waWaba">WhatsApp Business Account ID</label>
    <input id="waWaba" inputmode="numeric" autocomplete="off" dir="ltr" style="text-align:left" placeholder="1234567890…">
    <div class="err" id="waErr"></div>
    <div class="actions"><button class="ghost" data-act="wa-setup">ربط الواتساب</button></div>
    <p class="m" style="font-size:13px;color:var(--muted);margin:8px 0 0">المفتاح ينحفظ داخل الخادم بس، وما يرجع يطلع في التطبيق ولا في الشيت.</p></div>`;
  return `<h3 class="sec" id="waSec">الواتساب التلقائي</h3><div class="card">
    <div class="kv"><span>الرقم المرسل</span><b><span class="num" dir="ltr">${esc(w.phone||'—')}</span>${w.name?' · '+esc(w.name):''}</b></div>
    <div class="kv"><span>قالب الرسالة</span>${st}</div>
    ${w.tpl==='REJECTED'&&w.reason?`<p class="m" style="font-size:13px;color:var(--neg);margin:4px 0 0">السبب من ميتا: ${esc(w.reason)}</p>`:''}
    <div class="kv"><span>الورثة اللي لهم أرقام</span><b class="num">${n} من ${HEIRS.length}</b></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
    <button class="toggle" role="switch" aria-checked="${!!w.auto}" data-act="wa-auto"><span>إرسال تلقائي بعد كل حركة
      <small>${w.tpl==='APPROVED'?'كل حركة تضيفها أو تعدّلها أو تحذفها، أو حركة للوكيل تعتمدها، توصل لكل وارث في محادثته.':'يشتغل أول ما ميتا تعتمد القالب. للحين تطلع لك القائمة اليدوية.'}</small></span><span class="sw"></span></button>
    <div class="err" id="waErr"></div>
    <div class="actions" style="margin-top:12px">${w.tpl==='APPROVED'?'':'<button class="ghost" data-act="wa-status">تحديث حالة القالب</button>'}${w.tpl==='REJECTED'?'<button class="ghost" data-act="wa-retpl">طلب قالب جديد</button>':''}</div>
    <label class="k" for="waTo" style="margin-top:12px">رسالة تجربة لرقم</label>
    <div class="phrow" style="grid-template-columns:1fr auto"><input id="waTo" type="tel" inputmode="tel" autocomplete="off" placeholder="05XXXXXXXX"><button class="ghost" data-act="wa-test" style="white-space:nowrap">أرسل تجربة</button></div>
    <p class="m" style="font-size:13px;color:var(--muted);margin:4px 0 0">${w.tpl==='APPROVED'?'توصل نفس رسالة الحركات بس بأرقام تجربة.':'قبل اعتماد القالب توصلك رسالة ميتا الجاهزة "Hello World" بالإنجليزي، عشان تتأكد إن الربط شغّال.'} كل الرسائل تنسجل في ورقة "سجل الواتساب" في الشيت.</p>
    <div class="actions" style="margin-top:14px"><button class="ghost" data-act="wa-off" style="color:var(--neg)">فصل الربط</button></div></div>`;
}
function emailCard(){
  const c=notif.cfg||{},list=(c.emails||[]).join('\n');
  return `<h3 class="sec">إشعار الورثة بالإيميل</h3><div class="card">
    <button class="toggle" role="switch" aria-checked="${!!c.auto}" data-act="email-auto"><span>إرسال تلقائي بعد كل حركة
      <small>يوصل الإيميل من Gmail حقك لكل العناوين اللي تحت، وكل واحد ما يشوف عناوين الباقين. ونسخة توصلك أنت.</small></span><span class="sw"></span></button>
    <label class="k" for="nEmails">الإيميلات (كل إيميل في سطر)</label>
    <textarea id="nEmails" dir="ltr" style="min-height:120px;text-align:left" placeholder="name@example.com">${esc(list)}</textarea>
    <div class="err" id="nErr"></div>
    <div class="actions"><button class="ghost" data-act="email-save">حفظ الإيميلات</button></div>
    <p class="m" style="font-size:13px;color:var(--muted);margin:8px 0 0">الإيميلات محفوظة في ورقة الإعدادات في الشيت، وما تطلع للورثة في التطبيق.</p></div>`;
}

/* (الشيت يتحدث مباشرة من الخادم) */
const sheet={meta:null};function scheduleSync(){}function sheetCard(){return ''}function sheetPill(){return ''}

/* ===== تثبيت الصفحة الرئيسية بدون تمرير ===== */
function layoutHome(){
  const h=document.querySelector('.home'),fs=prefs.fs||1;
  syncBars();scroller.classList.remove('lock');
  if(h){
    h.style.height='';
    const avail=scroller.clientHeight/fs-16-14-1;
    const fits=h.getBoundingClientRect().height/fs<=avail+1;
    scroller.classList.toggle('lock',fits);
    if(fits){scrollTop0();h.style.height=Math.floor(avail)+'px';}
    return;
  }
  // باقي الصفحات: تثبت إذا محتواها كله داخل الشاشة (ما عدا الصفحات اللي فيها كتابة)
  const v=(store.mode==='api')?cur().v:store.mode;
  if(['form','settings','login','offline','loading'].includes(v))return;
  const last=appEl.lastElementChild;if(!last)return;
  const bottom=last.getBoundingClientRect().bottom-scroller.getBoundingClientRect().top+scroller.scrollTop;
  const fits=bottom<=scroller.clientHeight-4;
  scroller.classList.toggle('lock',fits);
  if(fits)scrollTop0();
}
window.addEventListener('resize',()=>{clearTimeout(layoutHome.t);layoutHome.t=setTimeout(layoutHome,120);});
// تحميل باقي الحركات تلقائياً لما يقرب المستخدم من آخر القائمة
scroller.addEventListener('scroll',()=>{if(mvMore.t)return;mvMore.t=requestAnimationFrame(()=>{mvMore.t=0;if(document.getElementById('mvMore')&&scroller.scrollTop+scroller.clientHeight>scroller.scrollHeight-700)mvMore();});},{passive:true});

/* ===== التنقل بالسحب (يتبع الإصبع، ويكفي سحب قصير أو سريع) ===== */
const TABS=['home','props'];
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
// السحب لليمين = القسم اللي بعده (باتجاه العقارات)، والسحب لليسار = اللي قبله (باتجاه الرئيسي). وفي الصفحات الداخلية أي سحب يرجعك.
function swipeTarget(dx){
  if(isForm()||store.mode!=='api')return null;
  if(state.stack.length>1)return 'back';
  const i=TABS.indexOf(state.stack[0].v),j=dx>0?i+1:i-1;
  return j>=0&&j<TABS.length?TABS[j]:null;
}
let sw=null;
const appEl=document.getElementById('app');
function setX(x,o){appEl.style.transform=x?`translate3d(${x.toFixed(1)}px,0,0)`:'';appEl.style.opacity=o==null?'':String(o);}
document.addEventListener('touchstart',e=>{
  sw=null;
  if(!prefs.swipe||e.touches.length!==1)return;
  if(e.target.closest('input,select,textarea,.table-wrap,.noswipe,header,nav,.modal-bg'))return;
  const p=e.touches[0];if(p.clientX<10||p.clientX>innerWidth-10)return;
  sw={x:p.clientX,y:p.clientY,dir:0,t:Date.now(),lx:p.clientX,lt:Date.now(),v:0};
  appEl.style.transition='none';
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!sw)return;const p=e.touches[0],dx=p.clientX-sw.x,dy=p.clientY-sw.y,now=Date.now();
  if(!sw.dir){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.15)sw.dir=1;else if(Math.abs(dy)>10){sw=null;return;}else return;}
  const dt=Math.max(1,now-sw.lt);sw.v=(p.clientX-sw.lx)/dt;sw.lx=p.clientX;sw.lt=now;
  if(reduceMotion)return;
  const has=!!swipeTarget(dx);
  setX(has?dx*0.9:dx*0.18,has?1-Math.min(Math.abs(dx)/(innerWidth*1.6),.35):null);
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!sw)return;const s=sw;sw=null;const p=e.changedTouches[0],dx=p.clientX-s.x,dy=p.clientY-s.y;
  const fast=Math.abs(s.v)>0.35&&Math.abs(dx)>24;
  const tg=s.dir===1&&(Math.abs(dx)>=50||fast)&&Math.abs(dx)>Math.abs(dy)?swipeTarget(dx):null;
  const W=innerWidth;
  if(!tg){appEl.style.transition=reduceMotion?'none':'transform .22s cubic-bezier(.2,.8,.2,1), opacity .22s';setX(0,null);return;}
  const dir=dx<0?-1:1;
  const go=()=>{appEl.style.transition='none';setX(0,null);if(tg==='back')back();else tab(tg);
    if(!reduceMotion&&appEl.animate)appEl.animate([{transform:`translate3d(${(-dir*W*0.35).toFixed(0)}px,0,0)`,opacity:0},{transform:'translate3d(0,0,0)',opacity:1}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});};
  if(reduceMotion){go();return;}
  appEl.style.transition='transform .14s ease-in, opacity .14s ease-in';setX(dir*W*0.6,0);
  setTimeout(go,140);
});
document.addEventListener('touchcancel',()=>{if(sw){sw=null;appEl.style.transition='transform .2s';setX(0,null);}});

applyPrefs();
bioLoad();if(BIO.on&&auth.pin&&auth.url)bioLock();
store.init();

</script>
