<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>القصيلي</title>
<meta name="theme-color" content="#0E3529">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="القصيلي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.1/dist/umd/supabase.js"></script>
<style>
/* القصيلي — هوية رسمية: زمرّدي عميق + ذهبي + عاجي. الخط الديواني/الرقعة للاسم، النسخ للأسماء، وخط واضح للواجهة */
:root{
  --bg:#F3EEE2; --surface:#FFFCF4; --ink:#1A2520; --muted:#6E6A5C; --line:#E0D3B6; --soft:#EEE5CF;
  --palm:#0F3B2D; --palm-ink:#F7EBCB; --brand:#0E3529; --brand-ink:#EBD7A4; --gold:#B08A45; --gold-ink:#86662C;
  --sadu:#8E2F2B; --date:#B08A45; --danger:#9B2F2A; --ok:#0F5A3F;
  --title:'Aref Ruqaa','Amiri',serif;
  --name:'Amiri','Noto Naskh Arabic',serif;
  --ui:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 18px rgba(40,30,10,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0B1410; --surface:#121E18; --ink:#EFE7D3; --muted:#A8A28C; --line:#2D3B31; --soft:#18271F;
    --palm:#CDAA62; --palm-ink:#0F1A14; --brand:#08201A; --brand-ink:#E3C887; --gold:#C9A65F; --gold-ink:#D9BC7C;
    --sadu:#D46A5E; --date:#CDAA62; --danger:#E07A6E; --ok:#7CC4A0; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); color-scheme:dark;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
body.no-nav .wrap{padding-bottom:calc(32px + env(safe-area-inset-bottom))}

/* ---------- app bar */
.appbar{position:sticky;top:0;z-index:15;background:var(--brand);color:var(--brand-ink);padding:calc(8px + env(safe-area-inset-top)) 16px 10px;
  box-shadow:0 2px 14px rgba(0,0,0,.18)}
.appbar::after{content:"";position:absolute;inset-inline:0;bottom:-6px;height:6px;
  background:linear-gradient(var(--gold),var(--gold)) 0 0/100% 1px no-repeat,
    radial-gradient(circle at 6px 3px,var(--gold) 1.3px,transparent 1.6px) 0 0/12px 6px repeat-x;opacity:.9}
.appbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{flex:1;display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:start;color:inherit}
.brand svg{width:40px;height:40px;flex:none;color:var(--gold)}
.brand .t{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:var(--title);font-weight:700;font-size:29px;letter-spacing:.3px;color:var(--brand-ink)}
.brand small{font-size:12px;letter-spacing:1.5px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roundbtn{width:44px;height:44px;border-radius:50%;border:1px solid color-mix(in srgb,var(--gold) 70%,transparent);background:none;color:var(--brand-ink);
  display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.roundbtn svg{width:22px;height:22px}
.dot{position:absolute;top:-3px;inset-inline-end:-3px;min-width:20px;height:20px;border-radius:10px;background:var(--sadu);color:#fff;font-size:12px;line-height:20px;text-align:center;padding:0 5px;font-weight:600}

/* ---------- bottom navigation */
.bnav{position:fixed;inset-inline:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(30,20,0,.07)}
.bnav .in{max-width:560px;margin:0 auto;display:flex;gap:6px}
.bnav button{flex:1;border:0;background:none;padding:6px 4px 4px;border-radius:14px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13.5px;font-weight:600;position:relative}
.bnav svg{width:25px;height:25px}
.bnav button.on{color:var(--palm)}
.bnav button.on::before{content:"";position:absolute;top:-7px;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.bnav .dot{top:0;inset-inline-end:calc(50% - 26px)}

/* ---------- headings & ornaments */
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);margin:4px 0 14px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.orn i{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--gold);display:block}
.pagehead{text-align:center;margin:2px 0 6px}
.pagehead h2{font-family:var(--name);font-size:30px;margin:0;line-height:1.3;text-wrap:balance}
.pagehead p{margin:2px auto 0;color:var(--muted);font-size:15px;max-width:34ch}

/* ---------- welcome (signed out) */
body.signed-out{background:var(--brand)}
.hero{color:var(--brand-ink);text-align:center;padding:calc(34px + env(safe-area-inset-top)) 16px 64px;position:relative}
.hero .emb{width:min(230px,62vw);aspect-ratio:1;margin:0 auto;color:var(--gold)}
.hero .emb svg{width:100%;height:100%}
.hero h1{font-family:var(--title);font-weight:700;font-size:56px;margin:0;line-height:1.1;color:var(--brand-ink)}
.hero .sub{letter-spacing:3px;font-size:13px;opacity:.8;margin-top:6px}
.hero .lead{max-width:30ch;margin:14px auto 0;opacity:.9;font-size:15.5px}
body.signed-out #app{display:flex;flex-direction:column;min-height:100dvh}
body.signed-out .paper{flex:1}
.paper{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-34px;padding:22px 16px calc(28px + env(safe-area-inset-bottom));position:relative}
.paper::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:54px;height:4px;border-radius:2px;background:var(--line)}
.paper .in{max-width:460px;margin:0 auto}
.paper h2{font-family:var(--name);font-size:28px;text-align:center;margin:6px 0 2px}
.paper .lead2{text-align:center;color:var(--muted);margin:0 auto 14px;max-width:34ch;font-size:15px}

/* ---------- forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
label.f{display:block;font-weight:600;margin:16px 0 6px;font-size:15.5px}
label.f:first-child{margin-top:0}
input.t,select.t{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 15px;font-size:19px;transition:border-color .15s,box-shadow .15s}
select.t{font-size:17px}
input.t:focus,select.t:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
input.t[dir=ltr]{text-align:left}
input.code{letter-spacing:10px;text-align:center!important;font-size:28px;font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-weight:600;font-size:18px;cursor:pointer;margin-top:18px;
  background:var(--palm);color:var(--palm-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 55%,transparent),0 4px 12px rgba(15,59,45,.18)}
.btn.ghost{background:none;box-shadow:none;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.6;cursor:default}
.link{background:none;border:0;color:var(--gold-ink);font-weight:600;cursor:pointer;padding:10px 8px;margin-top:8px;font-size:16px}
.note{color:var(--muted);font-size:14.5px;margin-top:10px}
.err{color:var(--danger);font-size:15px;margin-top:10px;min-height:1em}
.center{text-align:center}

/* ---------- lineage (chain) */
.lineage{display:flex;flex-direction:column-reverse;align-items:center;padding:6px 0 18px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}
.spine{width:2px;height:34px;background:var(--gold);position:relative}
.spine::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;background:var(--bg);border:1.5px solid var(--gold);transform:translate(-50%,-50%) rotate(45deg)}
.pill{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:min(100%,360px);
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 22px 12px;cursor:pointer;text-align:center;box-shadow:var(--shadow)}
.pill .rel{font-size:12.5px;letter-spacing:1px;color:var(--gold-ink);font-weight:600}
.pill .nm{font-family:var(--name);font-size:30px;font-weight:700;line-height:1.25}
.pill.me{background:var(--palm);border-color:var(--gold);color:var(--palm-ink);padding:14px 26px 16px}
.pill.me .rel{color:inherit;opacity:.85}
.pill.me .nm{font-size:36px}
.pill.frontier{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 20%,transparent),var(--shadow)}
.pill.root{border-color:var(--gold)}
.pill .more{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);font-size:12.5px;border:1px solid currentColor;border-radius:999px;padding:1px 10px;opacity:.8}
.lineage .node.new{animation:rise .45s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hint{text-align:center;color:var(--muted);margin:2px auto 0;max-width:32ch;font-size:15px}

/* ---------- sheet */
.scrim{position:fixed;inset:0;background:rgba(6,16,12,.5);z-index:30;backdrop-filter:blur(2px)}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:31;background:var(--surface);border-radius:26px 26px 0 0;max-height:90dvh;overflow:auto;overscroll-behavior:contain;
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);border-top:1px solid var(--gold)}
.sheet .grab{width:48px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:var(--name);font-size:30px;margin:0;line-height:1.3;text-align:center}
.sheet .sub{text-align:center;color:var(--gold-ink);font-weight:600;font-size:14px;letter-spacing:.5px;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 6px 10px;text-align:center;cursor:pointer;color:var(--ink)}
.tile svg{width:28px;height:28px;color:var(--gold-ink)}
.tile .tt{display:block;font-weight:600;font-size:14.5px;line-height:1.3;margin-top:4px}
.tile .cnt{display:block;color:var(--muted);font-size:12.5px}
.tile.empty{opacity:.55}
.tile.on{background:var(--palm);border-color:var(--gold);color:var(--palm-ink)}
.tile.on svg,.tile.on .cnt{color:inherit}
.names{margin-top:14px}
.names .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);
  width:100%;background:none;color:inherit;text-align:start;cursor:pointer}
.names .row b{font-family:var(--name);font-size:22px;font-weight:700}
.names .row .end{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
.names .row .chev{width:18px;height:18px;transition:transform .2s;flex:none}
.names .row[aria-expanded=true] .chev{transform:rotate(180deg)}
.names .row .ed{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12.5px;color:var(--gold-ink);background:none;cursor:pointer}
.names .tip{color:var(--muted);font-size:14px;margin:2px 4px 4px}
.names .none{color:var(--muted);padding:12px 4px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghead .gt{font-weight:700;font-size:16px}
.addall{border:1px solid var(--gold);color:var(--gold-ink);background:none;border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.addbox{margin-top:12px}
.addbtn{width:100%;border:1.5px dashed var(--gold);background:none;color:var(--gold-ink);border-radius:14px;padding:12px;font-weight:600;cursor:pointer}
.addform{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--bg)}

/* ---------- branch / tree */
.branch{position:relative;margin:0 auto}
.branch svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.branch path{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linejoin:round}
.branch path.sp{stroke:var(--sadu);stroke-width:1.3}
.bx{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);
  border-radius:14px;padding:3px 6px;text-align:center;line-height:1.2;box-shadow:0 1px 3px rgba(40,30,10,.08)}
button.bx{font:inherit;color:inherit;cursor:pointer}
.bx .r,.bx .n{pointer-events:none}
.bx .r{font-size:calc(11.5px * var(--z,1));color:var(--gold-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bx .n{font-family:var(--name);font-weight:700;font-size:calc(17px * var(--z,1));overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bx.f{border-style:dashed}
.bx.ch{border:1.5px solid var(--gold)}
.bx.me{background:var(--palm);border:1.5px solid var(--gold);color:var(--palm-ink)}
.bx.me .r{color:inherit;opacity:.85}
.bx.tg{border:2px solid var(--gold);background:var(--soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent)}
.upbtn{position:absolute;transform:translateX(-50%);border:1px solid var(--gold);background:var(--surface);color:var(--gold-ink);border-radius:999px;font-size:13px;padding:1px 10px;cursor:pointer;white-space:nowrap}
.treebox{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:16px 10px;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow)}
.sheet .treebox{max-height:58dvh;box-shadow:none;background:var(--bg)}
.home-tree .treebox{height:calc(100dvh - 300px);min-height:320px}
.branch-cap{text-align:center;font-size:15px;margin:8px 0}
.branch-cap b{font-family:var(--name);font-size:19px}
.branch-cap .ok{color:var(--ok);font-weight:600}
.treebar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.treebar .grow{flex:1;color:var(--muted);font-size:14px}

/* ---------- admin & lists */
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--soft);padding:4px;border-radius:14px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 8px;cursor:pointer;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list .item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(40,30,10,.05)}
.list .item .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.list .item .h b{font-size:17px}
.badge{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);white-space:nowrap}
.badge.new{background:var(--sadu);color:#fff;border-color:var(--sadu)}
.badge.active{color:var(--ok);border-color:var(--ok)}
.badge.pending{color:var(--gold-ink);border-color:var(--gold)}
.badge.blocked{color:var(--danger);border-color:var(--danger)}
.item .meta{color:var(--muted);font-size:14px;direction:ltr;text-align:right}
.item .acts,.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 13px;cursor:pointer;font-size:15px;color:var(--ink)}
.sbtn.primary{background:var(--palm);color:var(--palm-ink);border-color:var(--palm)}
.sbtn.danger{color:var(--danger);border-color:var(--danger);background:none}
.search{position:relative;margin-bottom:12px}
.toast{position:fixed;left:50%;width:max-content;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);
  padding:11px 20px;border-radius:999px;z-index:60;max-width:90vw;text-align:center;border:1px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.25)}
body.no-nav .toast{bottom:calc(24px + env(safe-area-inset-bottom))}
.offline{position:fixed;top:0;inset-inline:0;z-index:70;background:var(--sadu);color:#fff;text-align:center;font-size:14px;padding:calc(4px + env(safe-area-inset-top)) 8px 4px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:grid;place-items:center;min-height:40vh;color:var(--gold)}
.preview{width:100%;border-radius:12px;margin-top:12px;border:1px solid var(--line)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.menu .mi{display:flex;align-items:center;gap:14px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 6px;cursor:pointer;text-align:start;font-size:17px;color:var(--ink)}
.menu .mi svg{width:24px;height:24px;color:var(--gold-ink);flex:none}
.menu .mi.danger,.menu .mi.danger svg{color:var(--danger)}
.menu .acct{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:6px 0 8px}
.menu .acct b{font-family:var(--name);font-size:21px}
.steps{margin:6px 0 0;padding-inline-start:22px;display:grid;gap:8px}
.install{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--gold);border-radius:16px;padding:10px 12px;margin-bottom:14px}
.install svg{width:30px;height:30px;color:var(--gold-ink);flex:none}
.install .x{margin-inline-start:auto;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 6px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.sw{border:1px solid var(--line);border-radius:16px;padding:10px 6px 8px;cursor:pointer;background:var(--bg);color:var(--ink);text-align:center;font-size:14px}
.sw i{display:block;height:46px;border-radius:10px;margin-bottom:6px;border:1px solid rgba(0,0,0,.12)}
.sw.on{border:2px solid var(--gold)}
body.signed-out .wrap{max-width:none;padding:0}
.sw input[type=color]{width:100%;height:46px;border:0;padding:0;background:none;cursor:pointer;margin-bottom:2px}
/* ---------- «شجرتي» full screen */
body.immersed{overflow:hidden}
#immersive{position:fixed;inset:0;z-index:25;background:var(--bg);
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--gold) 22%,transparent) 1px,transparent 1.4px);background-size:26px 26px}
#immersive .stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#immersive .stage:active{cursor:grabbing}
#immersive .canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;margin:0}
#immersive .bx{box-shadow:0 2px 8px rgba(30,20,0,.12)}
.fctl{position:absolute;inset-inline:0;display:flex;align-items:center;gap:10px;padding:0 14px;pointer-events:none;transition:opacity .35s}
.fctl.top{top:calc(10px + env(safe-area-inset-top))}
.fctl.bottom{bottom:calc(14px + env(safe-area-inset-bottom));justify-content:center}
.fctl > *{pointer-events:auto}
.fcount{flex:1;text-align:center;font-family:var(--name);font-weight:700;font-size:17px;color:var(--gold-ink);opacity:.85;pointer-events:none}
.fbtn{width:46px;height:46px;border-radius:50%;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);display:grid;place-items:center;cursor:pointer;

<script>
"use strict";
const $ = s => document.querySelector(s);
const app = $('#app');
const AD = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 2600); }

const MSG = {

  cannot_demote_self: 'ما تقدر توقف حسابك أو تشيل صلاحيتك بنفسك.'
};
const errText = e => { const m = (e && (e.message || e.error_description || e.msg)) || String(e); for (const k in MSG) if (m.includes(k)) return MSG[k];
  if (/rate|limit|seconds/i.test(m)) return 'طلبت رمزًا قبل قليل. انتظر دقيقة ثم حاول مرة ثانية.';
  if (/expired|invalid/i.test(m)) return 'الرمز غير صحيح أو انتهت صلاحيته. اطلب رمزًا جديدًا.';
  if (/fetch|network|timeout|Failed to/i.test(m)) return 'الاتصال بطيء أو مقطوع. تأكد من الإنترنت وحاول مرة ثانية.';
  if (/jwt|refresh token/i.test(m)) return 'انتهت الجلسة. ادخل من جديد.';
  return 'ما تمت العملية. حاول مرة ثانية، وإذا تكررت أرسل للمشرف هذه الرسالة: ' + m; };

// ---------------------------------------------------------------- connection
const cfg = window.APP_CONFIG || {};
let sb = null;
if (cfg.url && cfg.key && window.supabase) sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true } });
let expiredShown = false;
async function rpc(name, args){
  let timer; const slow = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('timeout')), 25000); });
  try{
    const { data, error } = await Promise.race([sb.rpc(name, args || {}), slow]);
    if (error) { if (/jwt|invalid claim|refresh token/i.test(error.message || '')) sessionExpired(); throw error; }
    return data;
  } finally { clearTimeout(timer); }
}
async function sessionExpired(){
  if (expiredShown) return; expiredShown = true;
  try{ await sb.auth.signOut(); }catch(e){}
  profile = null; tree = null; treeCache = null; screenLogin(); toast('انتهت الجلسة. ادخل من جديد.'); setTimeout(() => { expiredShown = false; }, 4000);
}
// one tap = one action: the button stays disabled until the work finishes
async function guard(btn, fn){
  if (btn && btn.disabled) return; setBusy(btn, true);
  try{ return await fn(); } finally { if (btn && btn.isConnected) setBusy(btn, false); }
}

let profile = null;

// ---------------------------------------------------------------- screens
function showTop(on){ $('#topbar').classList.toggle('hidden', !on); document.body.classList.toggle('signed-out', !on); showNav(null); }
// bottom navigation: only for active members
function showNav(view){
  const on = !!view && profile && profile.status === 'active';
  $('#bnav').classList.toggle('hidden', !on); document.body.classList.toggle('no-nav', !on);
  if (on) $('#bnav').querySelectorAll('[data-go]').forEach(b => { b.classList.toggle('on', b.dataset.go === view); b.setAttribute('aria-current', b.dataset.go === view ? 'page' : 'false'); });
}
function go(view){
  if (view === 'admin') { screenAdmin(); return; }
  homeView = view; store.set('ft-view', view);
  if ($('#view')) drawHome(); else screenHome();
}
function setBusy(btn, on, label){ if(!btn) return; btn.disabled = on; if(on){ btn.dataset.l = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; } else if(btn.dataset.l){ btn.innerHTML = label || btn.dataset.l; } }

function screenSetup(){
  showTop(false);
  app.innerHTML = welcomeHead('التطبيق غير مربوط بعد', 'افتح ملف config.js وضع فيه رابط Supabase والمفتاح العام، ثم ارفع الملفات من جديد.');

      <div class="err" id="er"></div>

    setBusy(b,true);

      const { error } = await sb.auth.signInWithOtp({ email: em, options: { shouldCreateUser: true } });

      screenCode(em, ph, true);
    }catch(err){ setBusy(b,false); $('#er').textContent = errText(err); }
  };
}

function maskEmail(e){ const [u, d] = e.split('@'); return (u.length <= 2 ? u[0] + '*' : u.slice(0,2) + '•••' + u.slice(-1)) + '@' + d; }

function screenCode(email, phone, isNew){
  showTop(false);
  app.innerHTML = welcomeHead('اكتب الرمز', `أرسلنا رمزًا إلى <span dir="ltr">${esc(maskEmail(email))}</span>. إذا ما وصل، شوف مجلد الرسائل غير المرغوبة.`) + `
    <form class="card" id="f" novalidate>
      <label class="f" for="cd">الرمز</label>
      <input class="t code" id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="10" dir="ltr" placeholder="••••••">
      <button class="btn" id="go">${isNew ? 'تأكيد' : 'دخول'}</button>
      <div class="err" id="er"></div>
    </form>
    <div class="center"><button class="link" id="again">أرسل الرمز مرة ثانية</button> <button class="link" id="back">رجوع</button></div>`;
  const cd = $('#cd'); cd.focus();
  cd.oninput = () => { cd.value = cd.value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,''); };
  $('#back').onclick = () => isNew ? screenRegister(phone) : screenLogin(phone);
  $('#again').onclick = async () => { try{ const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: isNew } }); if (error) throw error; toast('أرسلنا رمزًا جديدًا'); }catch(err){ $('#er').textContent = errText(err); } };
  $('#f').onsubmit = async e => { e.preventDefault(); const b=$('#go'), token=cd.value.trim(); $('#er').textContent='';
    if (token.length < 6) { $('#er').textContent = 'اكتب الرمز كاملاً.'; return; }
    setBusy(b,true);
    try{
      let { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
      if (error && isNew) ({ error } = await sb.auth.verifyOtp({ email, token, type: 'signup' }));   // some projects send the first code as a sign-up confirmation
      if (error) throw error;
      if (isNew) await rpc('register_member', { p_phone: phone });
      store.del('ft-reg-phone');
      await boot();
    }catch(err){ setBusy(b,false); $('#er').textContent = errText(err); }
  };
}

// ---------------------------------------------------------------- reading the name from the ID card or passport (on this phone only)
let tesseractLoading = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve();
  if (!tesseractLoading) tesseractLoading = new Promise((res, rej) => { const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload = res; s.onerror = () => rej(new Error('fetch')); document.head.appendChild(s); });
  return tesseractLoading;
}
async function prepImage(file){   // shrink, greyscale and lift contrast so the letters read cleanly
  const url = URL.createObjectURL(file); const img = new Image(); img.src = url; await img.decode();
  const k = Math.min(1, 2200 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); const x = c.getContext('2d');
  x.filter = 'grayscale(1) contrast(1.45) brightness(1.05)'; x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return c;
}
const normN = s => s.replace(/[ً-ْـ‌-‏]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,'');
function pickNameLine(text, dict){
  const lines = text.split(/\n+/).map(l => l.replace(/[^؀-ۿ\s:]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  // 1) the line labelled «الاسم»
  for (let i = 0; i < lines.length; i++){ const l = lines[i];
    const m = l.match(/(?:الاسم|الإسم|اسم)\s*:?\s*(.+)$/);
    if (m && m[1].split(' ').length >= 2) return m[1].trim();
    if (/^(?:الاسم|الإسم)\s*:?$/.test(l) && lines[i+1]) return lines[i+1]; }
  // 2) otherwise the line with the most known family names in a row
  const known = new Set(dict || []); let best = '', bs = 0;
  for (const l of lines){ const w = l.split(' ').filter(x => x.length > 1); const s = w.filter(x => known.has(normN(x))).length; if (s > bs && w.length >= 2){ bs = s; best = w.join(' '); } }
  return best;
}

function screenIdentify(note){
  showTop(true); $('#title').textContent = 'التعرّف على اسمك';
  app.innerHTML = `
    <div class="card">
      <p style="margin-top:0">نقرأ اسمك الكامل من <b>الهوية</b> أو <b>الجواز</b> ونطابقه مع شجرة العائلة. الصورة تُقرأ على جوالك فقط ولا تُرسل ولا تُحفظ.</p>
      ${note ? `<p class="err">${esc(note)}</p>` : ''}
      <button class="btn" id="cam">صوّر الهوية أو الجواز</button>
      <div id="ocr" class="hidden"><div class="note" id="ocrMsg">جارٍ قراءة الاسم…</div><div class="progress"><i id="bar"></i></div></div>

  $('#cam').onclick = () => { file.value = ''; file.click(); };
  file.onchange = async () => { const f = file.files && file.files[0]; if (!f) return;
    $('#ocr').classList.remove('hidden'); $('#er').textContent = ''; $('#bar').style.width = '5%';
    try{
      const [canvas, dict] = await Promise.all([prepImage(f), rpc('name_dictionary').catch(() => []), loadTesseract()]);
      $('#pv').src = canvas.toDataURL('image/jpeg', .7); $('#pv').classList.remove('hidden');
      const res = await window.Tesseract.recognize(canvas, 'ara', { logger: m => { if (m.status === 'recognizing text') $('#bar').style.width = Math.round(10 + m.progress * 90) + '%'; else $('#ocrMsg').textContent = m.status && m.status.includes('load') ? 'جارٍ تجهيز قارئ الحروف (أول مرة فقط)…' : 'جارٍ قراءة الاسم…'; } });
      const name = pickNameLine(res.data.text || '', dict);
      $('#ocr').classList.add('hidden');
      if (name) { $('#nm').value = name; toast('راجع الاسم وصحّحه إن لزم'); }
      else $('#er').textContent = 'ما قدرنا نقرأ الاسم من الصورة. صوّر مرة ثانية في مكان فيه إضاءة، أو اكتب اسمك بنفسك.';
    }catch(err){ $('#ocr').classList.add('hidden'); $('#er').textContent = errText(err).includes('الاتصال') ? 'تعذّر تحميل قارئ الحروف. تأكد من الإنترنت، أو اكتب اسمك بنفسك.' : errText(err); }
  };
  $('#f').onsubmit = async e => { e.preventDefault(); const nm = $('#nm').value.trim(), b = $('#go'); $('#er').textContent = '';
    if (nm.split(/\s+/).length < 2) { $('#er').textContent = 'اكتب اسمك واسم أبيك على الأقل، والأفضل الاسم الرباعي.'; return; }
    setBusy(b, true);
    try{ await handleClaim(await rpc('claim_person', { p_full_name: nm }), nm); }
    catch(err){ $('#er').textContent = errText(err); }
    setBusy(b, false);
  };
}

async function handleClaim(r, nm){
  if (!r) return;
  if (r.status === 'linked') { toast('أهلًا ' + r.person); await boot(); return; }

  if (r.status === 'too_short' || r.status === 'need_more') { $('#er').textContent = 'فيه أكثر من شخص بهذا الاسم. أضف اسم الجد والذي بعده.'; return; }

    $('#choose').innerHTML = `<p class="note">فيه أكثر من شخص بهذا الاسم. اختر نفسك:</p>` +
      r.candidates.map(c => `<button class="btn ghost" data-id="${esc(c.id)}">${esc(c.label)}</button>`).join('');

}

function closeImmersive(){ const ov = $('#immersive'); if (ov) ov.remove(); document.body.classList.remove('immersed'); }

function panZoom(stage, el, W, H){
  let s = 1, x = 0, y = 0, moved = false, anim = null;
  const pts = new Map(); let last = null;
  const minS = () => Math.max(.12, Math.min(1, Math.min(stage.clientWidth / W, stage.clientHeight / H) * .92)), maxS = 2.6;
  const clamp = () => {
    const sw = stage.clientWidth, sh = stage.clientHeight, cw = W * s, ch = H * s, m = 120;
    x = cw + 2 * m < sw ? (sw - cw) / 2 : Math.min(m, Math.max(sw - cw - m, x));
    y = ch + 2 * m < sh ? (sh - ch) / 2 : Math.min(m, Math.max(sh - ch - m, y));
  };
  const apply = (smooth) => { clamp(); el.style.transition = smooth ? 'transform .28s ease' : 'none'; el.style.transform = `translate(${x}px,${y}px) scale(${s})`; treeView = { x, y, s }; };
  const zoomAt = (f, cx, cy, smooth) => { const ns = Math.min(maxS, Math.max(minS(), s * f)); x = cx - (cx - x) * (ns / s); y = cy - (cy - y) * (ns / s); s = ns; apply(smooth); };
  const local = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  stage.addEventListener('pointerdown', e => { pts.set(e.pointerId, local(e)); if (pts.size === 1) moved = false; last = null; });
  const onMove = e => {
    if (!pts.has(e.pointerId)) return; const p = local(e), prev = pts.get(e.pointerId); pts.set(e.pointerId, p);
    if (pts.size === 1) { const dx = p.x - prev.x, dy = p.y - prev.y; if (Math.abs(dx) + Math.abs(dy) > 0) { x += dx; y += dy; if (Math.hypot(dx, dy) > .5) moved = moved || true; apply(false); } }
    else if (pts.size === 2) {
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2; moved = true;
      if (last) { x += mx - last.mx; y += my - last.my; zoomAt(d / last.d, mx, my, false); }
      last = { d, mx, my };
    }
  };
  const onUp = e => { pts.delete(e.pointerId); last = null; };
  addEventListener('pointermove', onMove); addEventListener('pointerup', onUp); addEventListener('pointercancel', onUp);
  // a drag is not a tap: do not open a name after moving the tree
  let downAt = null;
  stage.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; }, true);
  stage.addEventListener('click', e => { if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 8) { e.stopPropagation(); e.preventDefault(); } }, true);
  stage.addEventListener('wheel', e => { e.preventDefault(); const p = local(e); zoomAt(Math.exp(-e.deltaY * .0015), p.x, p.y, false); }, { passive: false });
  let lastTap = 0;
  stage.addEventListener('pointerup', e => { const now = Date.now(); if (e.target.closest('button.bx')) return;
    if (now - lastTap < 300 && downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 8) { const p = local(e); zoomAt(1.6, p.x, p.y, true); lastTap = 0; } else lastTap = now; });
  const stop = e => e.preventDefault(); document.addEventListener('gesturestart', stop);   // Safari: no page zoom while in the tree
  const obs = new MutationObserver(() => { if (!document.body.contains(stage)) { removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp); removeEventListener('pointercancel', onUp); document.removeEventListener('gesturestart', stop); obs.disconnect(); } });
  obs.observe(document.body, { childList: true, subtree: true });
  return {
    set(v){ s = v.s; x = v.x; y = v.y; apply(false); },
    zoomBy(f){ zoomAt(f, stage.clientWidth / 2, stage.clientHeight / 2, true); },
    center(node, scale, smooth){ if (!node) { this.fit(); return; } s = Math.min(maxS, Math.max(minS(), scale || s));
      const nx = node.offsetLeft + node.offsetWidth / 2, ny = node.offsetTop + node.offsetHeight / 2;
      x = stage.clientWidth / 2 - nx * s; y = stage.clientHeight / 2 - ny * s; apply(smooth); },
    fit(smooth){ s = minS(); x = (stage.clientWidth - W * s) / 2; y = (stage.clientHeight - H * s) / 2; apply(smooth); }
  };
}

// which kind of relative each list adds, and whether it can be added here
const ADD_KIND = { brothers:'brother', sisters:'sister', sons:'son', daughters:'daughter', wives:'wife', uncles:'uncle', aunts:'aunt', mother:'mother', khal:'khal', khala:'khala' };
function canAdd(key, r, k){
  if (!ADD_KIND[key]) return false;
  if (k === 0) return key !== 'brothers' && key !== 'sisters' || chain.length > 1;
  if (key === 'uncles' || key === 'aunts') return !r.is_root;
  if (key === 'mother') return !r.has_mother;
  if (key === 'khal' || key === 'khala') return !!r.has_mother;
  return false;
}
let lineageChanged = false;

    sh.innerHTML = `<div class="grab"></div><h3>${esc(r.name)}</h3><div class="sub">${esc(r.relation)}${k === chain.length - 1 && k > 0 ? ' الأكبر' : ''}</div>

          ${g.people.length > 1 ? `<button class="addall">أضف الكل إلى شجرتي</button>` : ''}</div>` + (g.people.length
        ? `<div class="tip">اضغط أي اسم لينضاف إلى شجرتك ويظهر كيف يتصل بك.</div>` + g.people.map((x, j) => `<button class="row" data-j="${j}" aria-expanded="false"><b>${esc(x.name)}</b>
            <span class="end">${x.note ? `<span>${esc(x.note)}</span>` : ''}${r.can_edit && x.id ? `<span class="ed" role="button" data-ed="${esc(x.id)}">تعديل</span>` : ''}<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></button>`).join('')

        + (canAdd(g.key, r, k) ? `<div class="addbox"><button class="addbtn">＋ ${g.key === 'mother' ? 'سجّل ' + esc(g.title) : 'أضف إلى «' + esc(g.title) + '»'}</button></div>` : '');

function buildTree(paths){
  const N = new Map(), P = new Map(), K = new Map(), S = new Map();
  const add = (n, gen) => { const id = nkey(n); let x = N.get(id);
    if (!x) { x = { id, n: n.n, r: n.r, g: n.g || 'm', gen }; N.set(id, x); }
    if (n.cid) { x.cid = n.cid; x.k = n.k; }
    return id; };
  const link = (par, ch) => { if (!P.has(ch)) P.set(ch, new Set()); if (P.get(ch).has(par)) return; P.get(ch).add(par); if (!K.has(par)) K.set(par, []); K.get(par).push(ch); };
  const marry = (a, b) => { for (const [x, y] of [[a, b], [b, a]]) { if (!S.has(x)) S.set(x, []); if (!S.get(x).includes(y)) S.get(x).push(y); } };
  for (const path of paths) {
    let prev = null, gen = 0;
    path.forEach((n, i) => {
      if (i === 0) { prev = add(n, 0); return; }
      gen += n.s === 'up' ? -1 : n.s === 'down' ? 1 : 0;
      const id = add(n, gen);
      if (n.s === 'up') link(id, prev); else if (n.s === 'down') link(prev, id); else marry(prev, id);
      prev = id;
    });

  for (const ps of P.values()) { const a = [...ps]; if (a.length === 2) marry(a[0], a[1]); }   // a child's two parents are a couple
  return { N, P, K, S };

// tidy layout: couples side by side, children centred under them, in-laws' families beside them; x in slots, row = generation
function layoutTree(T, meId){

  const merge = (out, pos, dx) => { for (const [id, x] of pos) { out.pos.set(id, x + dx); const r = N.get(id).gen, c = out.cont.get(r);
    out.cont.set(r, c ? [Math.min(c[0], x + dx), Math.max(c[1], x + dx)] : [x + dx, x + dx]); } };
  const fits = (out, pos, dx) => { for (const [id, x] of pos) { const c = out.cont.get(N.get(id).gen); if (c && x + dx > c[0] - 1 && x + dx < c[1] + 1) return false; } return true; };
  const packRight = (out, sub) => { let d = -Infinity; for (const [r, [l]] of sub.cont) { const c = out.cont.get(r); if (c) d = Math.max(d, c[1] + 1 - l); }
    if (d === -Infinity) { d = 0; if (out.pos.size) { const mx = Math.max(...[...out.cont.values()].map(c => c[1])), mn = Math.min(...[...sub.cont.values()].map(c => c[0])); d = mx + 1 - mn; } } return d; };

    const natal = sps.map(s => { const p = parents(s).find(x => !seen.has(x)); if (p) seen.add(p);
      const sibs = p ? (K.get(p) || []).filter(x => !seen.has(x)) : []; sibs.forEach(x => seen.add(x)); return { s, p, sibs }; });
    const kids = []; for (const u of [v, ...sps]) for (const c of (K.get(u) || [])) if (!seen.has(c) && !kids.includes(c)) kids.push(c);
    kids.forEach(c => seen.add(c));

}

function treeMarkup(paths, focusKey, opts = {}){
  const T = buildTree(paths), meId = nkey(paths[0][0]), pos = layoutTree(T, meId), { N, P, S } = T;

  const X = id => Math.round((maxX - pos.get(id)) * slot), Y = id => (N.get(id).gen - minG) * pitch + top;   // RTL: mirror

    if (!pos.has(c)) continue;
    const par = [...ps].filter(p => pos.has(p)), cx = X(c) + bw / 2, cy = Y(c), my = cy - (pitch - bh) / 2;
    if (par.length === 2 && Math.abs(pos.get(par[0]) - pos.get(par[1])) <= 1.01) {

    } else for (const p of par) svg += `<path d="M${X(p) + bw / 2} ${Y(p) + bh} V${my} H${cx} V${cy}"/>`;
  }
  const done = new Set();
  for (const [a, list] of S) for (const b of list) {
    const k = [a, b].sort().join('~'); if (done.has(k) || !pos.has(a) || !pos.has(b)) continue; done.add(k);
    const [l, r] = X(a) < X(b) ? [a, b] : [b, a], x1 = X(l) + bw, x2 = X(r), cy = Y(a) + bh / 2;
    if (x2 > x1) svg += `<path class="sp" d="M${x1} ${cy - 3} H${x2} M${x1} ${cy + 3} H${x2}"/>`;
  }
  const inner = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${svg}</svg>
    ${[...N.values()].map(n => { const tag = n.cid ? 'button' : 'div';
      return `<${tag} class="bx ${n.id === meId ? 'me' : ''} ${n.id === focusKey ? 'tg' : ''} ${n.cid && n.id !== meId ? 'ch' : ''} ${n.g === 'f' ? 'f' : ''}"

        style="left:${X(n.id)}px;top:${Y(n.id)}px;width:${bw}px;height:${bh}px"><span class="r">${esc(n.r)}</span><span class="n">${esc(n.n || '—')}</span></${tag}>`; }).join('')}`;

}

  { id: 'coal',  name: 'فحمي',      dark: true, v: { bg:'#111111', surface:'#1A1A19', line:'#33312C', soft:'#22211E' } }
];
const LIGHT_INK = { ink:'#1A2520', muted:'#6E6A5C', palm:'#0F3B2D', 'palm-ink':'#F7EBCB', brand:'#0E3529', 'brand-ink':'#EBD7A4', gold:'#B08A45', 'gold-ink':'#86662C', sadu:'#8E2F2B', date:'#B08A45', danger:'#9B2F2A', ok:'#0F5A3F' };
const DARK_INK  = { ink:'#EFE7D3', muted:'#A8A28C', palm:'#CDAA62', 'palm-ink':'#0F1A14', brand:'#08201A', 'brand-ink':'#E3C887', gold:'#C9A65F', 'gold-ink':'#D9BC7C', sadu:'#D46A5E', date:'#CDAA62', danger:'#E07A6E', ok:'#7CC4A0' };
const hexMix = (a, b, t) => '#' + [0, 2, 4].map(i => Math.round(parseInt(a.substr(i + 1, 2), 16) * (1 - t) + parseInt(b.substr(i + 1, 2), 16) * t).toString(16).padStart(2, '0')).join('');
const isDark = hex => { const c = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4)); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2] < .18; };
function themeVars(t){       // t = {id} or {custom:'#rrggbb'}
  if (!t) return null;
  if (t.custom && /^#[0-9a-f]{6}$/i.test(t.custom)) {
    const bg = t.custom.toLowerCase(), dark = isDark(bg), toward = dark ? '#ffffff' : '#ffffff';
    return { dark, v: { bg, surface: hexMix(bg, toward, dark ? .06 : .7), line: hexMix(bg, dark ? '#ffffff' : '#000000', dark ? .16 : .13), soft: hexMix(bg, dark ? '#ffffff' : '#000000', dark ? .08 : .05) } };
  }
  const th = THEMES.find(x => x.id === t.id); if (!th || !th.v) return null;
  return { dark: !!th.dark, v: th.v };
}
function applyTheme(t){
  const root = document.documentElement, tv = themeVars(t);
  const keys = ['bg','surface','line','soft', ...Object.keys(LIGHT_INK)];
  if (!tv) { keys.forEach(k => root.style.removeProperty('--' + k)); root.style.removeProperty('color-scheme'); }
  else {
    const all = { ...(tv.dark ? DARK_INK : LIGHT_INK), ...tv.v };
    keys.forEach(k => root.style.setProperty('--' + k, all[k])); root.style.setProperty('color-scheme', tv.dark ? 'dark' : 'light');
  }
  const meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.content = tv ? (tv.dark ? DARK_INK.brand : LIGHT_INK.brand) : '#0E3529';
}
function savedTheme(){ try{ return JSON.parse(store.get('ft-theme') || 'null'); }catch(e){ return null; } }
function currentTheme(){ return savedTheme() || (profile && profile.theme) || { id: 'auto' }; }
applyTheme(currentTheme());

      ${isAdmin ? `<button class="btn" id="fam">اجعل هذا اللون للعائلة كلها</button>
        <div class="note center">من ما اختار لونًا بنفسه يشوف لون العائلة.</div>` : ''}

    sh.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { const t = { id: b.dataset.id }; store.set('ft-theme', JSON.stringify(t)); applyTheme(t); draw(); });
    const cc = sh.querySelector('#cc');
    cc.oninput = () => applyTheme({ custom: cc.value });
    cc.onchange = () => { const t = { custom: cc.value }; store.set('ft-theme', JSON.stringify(t)); applyTheme(t); draw(); };

  };
  draw(); document.body.append(scrim, sh);
}

const chainLabel = (id, n = 4) => { const out = []; let p = byId[id]; while (p && out.length < n) { out.push(p.n); p = byId[p.p]; } return out.join(' بن '); };

      <button class="sbtn primary" id="wadd" style="margin-top:8px">إضافة الزوجة</button></form>
    <h4 style="margin:22px 0 6px">أبناؤه وبناته</h4>
    <div class="list">${kids.map(k => `<button class="sbtn" style="display:block;width:100%;text-align:start;margin-bottom:6px" data-k="${esc(k.id)}">${esc(k.n)} ${k.g==='f'?'(بنت)':''}</button>`).join('') || '<p class="note">ما فيه أبناء مسجّلون.</p>'}</div>
    <form id="kf" class="item"><label class="f" for="kn" style="margin-top:0">إضافة ابن أو بنت</label><input class="t" id="kn" placeholder="الاسم">
      <select class="t" id="kg" style="margin-top:8px"><option value="m">ابن</option><option value="f">بنت</option></select>
      ${(p.ws||[]).length ? `<select class="t" id="km" style="margin-top:8px"><option value="">الأم غير معروفة</option>${p.ws.map(w => `<option value="${esc(w.i)}">أمه: ${esc(w.n)}</option>`).join('')}</select>` : ''}
      <button class="sbtn primary" style="margin-top:8px">إضافة</button></form>
    <div class="acts" style="margin-top:16px">${father ? `<button class="sbtn" id="up">الذهاب إلى أبيه</button>` : ''}<button class="sbtn danger" id="del">حذف هذا الشخص</button><button class="sbtn" id="bk">بحث جديد</button></div>
    <div class="err" id="er"></div></div>`;
  const save = async obj => { const out = { id: p.id, n: p.n, p: p.p, o: p.o, g: p.g, b: p.b, mi: p.mi, ws: p.ws || [], ...obj };
    await rpc('admin_save_person', { p: out }); Object.assign(p, out); };
  $('#n').maxLength = 60;
  $('#sv').onclick = e => guard(e.currentTarget, async () => { $('#er').textContent = ''; if (!$('#n').value.trim()) { $('#er').textContent = MSG.name_required; return; }
    try{ await save({ n: $('#n').value.trim(), g: $('#g').value, mi: $('#mi') ? ($('#mi').value || null) : p.mi }); toast('تم الحفظ'); editPerson(id); }catch(err){ $('#er').textContent = errText(err); } });
  let wifeFather = null;
  $('#wfp').appendChild(personPicker(fid => { wifeFather = fid; $('#wfp').innerHTML = `<div class="note">أبوها: ${esc(chainLabel(fid, 4))}</div>`; }, 'ابحث عن أبيها إن كانت من العائلة'));
  $('#wf').onsubmit = e => { e.preventDefault(); return guard($('#wadd'), async () => { const n = $('#wn').value.trim(); if (!n) { $('#er').textContent = 'اكتب اسم الزوجة.'; return; }
    const w = { i: Math.random().toString(36).slice(2, 9), n }; if (wifeFather) { w.f = wifeFather; const sis = tree.find(x => x.p === wifeFather && x.g === 'f' && normN(x.n) === normN(n.split(' ')[0])); if (sis) w.d = sis.id; } else if ($('#wh').value.trim()) w.h = $('#wh').value.trim();
    try{ await save({ ws: [...(p.ws || []), w] }); toast('أضيفت الزوجة'); editPerson(id); }catch(err){ $('#er').textContent = errText(err); } }); };
  $('#ws').querySelectorAll('[data-wd]').forEach(b => b.onclick = () => { const w = (p.ws || [])[+b.dataset.wd];
    if (!confirm('حذف «' + (w ? w.n : '') + '» من زوجات ' + p.n + '؟ تقدر تتراجع من «السجل».')) return;
    guard(b, async () => { const ws = (p.ws || []).slice(); ws.splice(+b.dataset.wd, 1); try{ await save({ ws }); toast('تم الحذف'); editPerson(id); }catch(err){ $('#er').textContent = errText(err); } }); });
  $('#kf').onsubmit = e => { e.preventDefault(); return guard($('#kf').querySelector('button'), async () => { const n = $('#kn').value.trim(); if (!n) { $('#er').textContent = 'اكتب الاسم.'; return; }
    const o = kids.length ? Math.max(...kids.map(k => +k.o || 0)) + 1 : Date.now();
    try{ const nid = await rpc('admin_save_person', { p: { n, p: id, g: $('#kg').value, o, mi: $('#km') ? ($('#km').value || null) : null } });
      tree.push({ id: nid, n, p: id, g: $('#kg').value, o, b: '', mi: $('#km') ? ($('#km').value || null) : null, ws: [] }); byId[nid] = tree[tree.length - 1]; toast('تمت الإضافة'); editPerson(id); }catch(err){ $('#er').textContent = errText(err); } }); };
  $('#pane').querySelectorAll('[data-k]').forEach(b => b.onclick = () => editPerson(b.dataset.k));
  if ($('#up')) $('#up').onclick = () => editPerson(p.p);
  $('#bk').onclick = paneTree;
  $('#del').onclick = e => { const b = e.currentTarget;
    if (kids.length) { $('#er').textContent = MSG.has_children; return; }
    if (!confirm('حذف «' + chainLabel(id, 3) + '» من الشجرة؟ تقدر تسترجعه من «السجل» في الإدارة.')) return;
    guard(b, async () => { try{ await rpc('admin_delete_person', { pid: id }); tree = tree.filter(x => x.id !== id); delete byId[id]; toast('تم الحذف، وتقدر تسترجعه من «السجل»'); father ? editPerson(father.id) : paneTree(); }catch(err){ $('#er').textContent = errText(err); } }); };
}

// ---------------------------------------------------------------- start
async function boot(){
  if (!sb) { screenSetup(); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { screenLogin(); return; }
  try{
    profile = await rpc('my_profile');
    if (!profile) {   // confirmed the email but the phone was not saved yet
      const ph = store.get('ft-reg-phone') || store.get('ft-phone');
      if (ph) { await rpc('register_member', { p_phone: ph }); profile = await rpc('my_profile'); }
      if (!profile) { await sb.auth.signOut(); screenRegister(); return; }
    }
    profile.uid = session.user.id;
    applyTheme(currentTheme());
  }catch(err){ app.innerHTML = `<p class="err">${esc(errText(err))}</p><button class="btn ghost" id="retry">إعادة المحاولة</button>`; $('#retry').onclick = () => location.reload(); return; }
  const canEdit = profile.status === 'active' && (profile.role === 'admin' || profile.role === 'editor');
  $('#adminBtn').classList.toggle('hidden', !canEdit);
  updateDot();
  if (profile.title) { document.title = profile.title; $('#brandName').textContent = profile.title; }
  if (profile.status === 'blocked') screenBlocked();
  else if (profile.status === 'unlinked') screenIdentify();
  else if (profile.status === 'pending') screenPending();
  else screenHome();
}
$('#menuBtn').onclick = () => openMenu();
$('#bnav').querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
$('#brandBtn').onclick = () => { if (profile && profile.status === 'active') go('chain'); };
const netState = () => $('#offline').classList.toggle('hidden', navigator.onLine !== false);
addEventListener('online', netState); addEventListener('offline', netState); netState();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
